<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>HIMS 財報全自動化分析儀表板</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #2563eb;
      --secondary: #10b981;
      --danger: #dc2626;
      --accent: #6366f1;
      --gray-bg: #f8fafc;
      --card-border: #e2e8f0;
      --text-main: #1e293b;
      --text-muted: #64748b;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background-color: #ffffff;
      color: var(--text-main);
      margin: 0;
      line-height: 1.5;
    }

    main.page {
      max-width: 1000px;
      margin: 0 auto;
      padding: 60px 24px 100px;
    }

    .header { margin-bottom: 40px; }
    .page-title { font-size: 36px; font-weight: 800; letter-spacing: -0.025em; margin: 0; }
    .meta-info { font-size: 14px; color: var(--text-muted); margin-top: 8px; }

    .ai-insight-card {
      background: var(--gray-bg);
      border-left: 4px solid var(--primary);
      padding: 24px;
      border-radius: 8px;
      margin: 32px 0 48px;
    }
    .ai-insight-card h3 { margin: 0 0 12px; font-size: 18px; color: var(--primary); display: flex; align-items: center; }
    .one-liner { font-size: 19px; font-weight: 600; margin-bottom: 16px; }
    .risk-tag { background: #fee2e2; color: var(--danger); padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 700; margin-right: 8px; display: inline-block; vertical-align: middle; }

    .section-title {
      font-size: 24px;
      font-weight: 700;
      margin: 60px 0 24px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--card-border);
      scroll-margin-top: 24px;
    }

    .statement-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
      margin: 0 0 56px;
    }

    .statement-card.focus-entry {
      grid-column: 1 / -1;
      min-height: auto;
      background: linear-gradient(135deg, #fff7ed 0%, #ffffff 70%);
    }

    .statement-card {
      display: block;
      width: 100%;
      min-height: 210px;
      padding: 24px;
      color: inherit;
      font: inherit;
      text-align: left;
      text-decoration: none;
      background: #fff;
      border: 1px solid var(--card-border);
      border-top: 5px solid var(--statement-color);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .statement-card:hover,
    .statement-card.active {
      transform: translateY(-4px);
      box-shadow: 0 14px 30px rgba(15, 23, 42, 0.11);
    }

    .statement-card.active {
      background: color-mix(in srgb, var(--statement-color) 6%, white);
      border-color: var(--statement-color);
    }

    .statement-label {
      color: var(--statement-color);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .statement-card h2 {
      margin: 6px 0 8px;
      font-size: 22px;
    }

    .statement-card p {
      min-height: 42px;
      margin: 0 0 16px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .statement-metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .statement-metric {
      padding: 5px 9px;
      color: #334155;
      background: #f1f5f9;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .statement-link {
      display: block;
      margin-top: 18px;
      color: var(--statement-color);
      font-size: 13px;
      font-weight: 700;
    }

    .supplementary-nav {
      display: flex;
      justify-content: flex-end;
      margin: -36px 0 40px;
    }

    .supplementary-button {
      padding: 10px 16px;
      color: #475569;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      background: #f8fafc;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      cursor: pointer;
    }

    .supplementary-button:hover,
    .supplementary-button.active {
      color: #c2410c;
      background: #fff7ed;
      border-color: #fb923c;
    }

    .report-panel {
      display: none;
    }

    .report-panel.active {
      display: block;
      animation: panel-in 0.25s ease;
    }

    .focus-intro {
      padding: 24px;
      margin-bottom: 20px;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 16px;
    }

    .focus-type {
      margin: 0 0 8px;
      color: #9a3412;
      font-size: 20px;
      font-weight: 800;
    }

    .focus-intro p {
      margin: 0;
      color: #475569;
    }

    .focus-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .focus-item {
      padding: 20px;
      color: inherit;
      font: inherit;
      text-align: left;
      background: #fff;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      cursor: pointer;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .focus-item:hover {
      transform: translateY(-2px);
      border-color: #fb923c;
    }

    .focus-item strong {
      display: block;
      margin-bottom: 8px;
      color: #0f172a;
      font-size: 17px;
    }

    .focus-item span {
      color: #64748b;
      font-size: 14px;
      line-height: 1.6;
    }

    .focus-item small {
      display: block;
      margin-top: 12px;
      color: #ea580c;
      font-weight: 700;
    }

    .focus-quick-nav {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 14px 16px;
      margin: 0 0 20px;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      border-radius: 12px;
    }

    .focus-quick-nav strong {
      margin-right: 4px;
      color: #9a3412;
      font-size: 14px;
    }

    .focus-quick-button,
    .focus-back-button {
      padding: 7px 10px;
      color: #475569;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      background: #fff;
      border: 1px solid #fdba74;
      border-radius: 999px;
      cursor: pointer;
    }

    .focus-quick-button:hover,
    .focus-quick-button.current {
      color: #c2410c;
      background: #ffedd5;
      border-color: #f97316;
    }

    .focus-back-button {
      margin-left: auto;
      color: #9a3412;
    }

    @keyframes panel-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .metric-card {
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 40px;
      background: #fff;
      scroll-margin-top: 24px;
    }

    .metric-name { font-size: 22px; font-weight: 700; margin: 0 0 8px; color: #0f172a; }
    
    details { margin-bottom: 20px; }
    details summary { cursor: pointer; font-size: 14px; font-weight: 600; color: var(--primary); list-style: none; }
    details summary::before { content: "▶ "; font-size: 10px; }
    details[open] summary::before { content: "▼ "; }
    .desc-content { background: #f1f5f9; padding: 16px; border-radius: 8px; margin-top: 10px; font-size: 15px; color: #475569; }

    .chart-container { height: 380px; width: 100%; margin: 24px 0; }

    /* 修正後的 AI 分析顯示區 */
    .analysis-section {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--card-border);
    }
    .analysis-summary h4 {
      font-size: 16px;
      margin: 0 0 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .summary-text { font-size: 15px; color: #334155; line-height: 1.8; }

    /* 新增：成因分析區塊樣式 */
    .reason-section {
      margin-top: 16px;
      padding: 16px;
      border-radius: 12px;
      background: #f0f9ff; /* Pro 版的藍色背景 */
      border: 1px solid #bae6fd;
    }
    
    .reason-section.locked {
      background: #f8fafc; /* 免費版的灰色背景 */
      border: 1px dashed #cbd5e1;
    }

    .reason-title {
      font-size: 14px;
      font-weight: 700;
      color: #0369a1;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
    }

    .locked .reason-title {
      color: #64748b;
    }

    .reason-list {
      margin: 0;
      padding-left: 18px;
      font-size: 14px;
      color: #334155;
    }

    .lock-text {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.6;
    }

    .upgrade-link {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
      display: inline-block;
      margin-top: 8px;
    }

    @media (max-width: 780px) {
      main.page { padding: 36px 16px 72px; }
      .page-title { font-size: 30px; }
      .statement-grid { grid-template-columns: 1fr; }
      .statement-card { min-height: auto; }
      .statement-card p { min-height: auto; }
      .supplementary-nav { justify-content: stretch; margin-top: -36px; }
      .supplementary-button { width: 100%; }
      .focus-list { grid-template-columns: 1fr; }
      .focus-back-button { width: 100%; margin-left: 0; }
      .metric-card { padding: 22px 16px; }
      .chart-container { height: 300px; }
    }
  </style>
</head>
<body>

<main class="page">
  <div class="header">
    <h1 class="page-title">HIMS 財報全自動化分析儀表板</h1>
    <div class="meta-info" id="update-info">載入中...</div>
  </div>

  <div class="ai-insight-card">
    <h3>🤖 AI 智能診斷</h3>
    <div class="one-liner" id="one-liner"></div>
    <div id="risk-container" style="line-height: 2;"></div>
  </div>

  <div id="dynamic-content"></div>
</main>

<script>
// --- 1. Supabase 配置 (請務必使用你剛才設定好 RLS 的那個專案) ---
const SUPABASE_URL = "https://zlkexplsleznuebighte.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpsa2V4cGxzbGV6bnVlYmlnaHRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU0MzAwNjUsImV4cCI6MjA4MTAwNjA2NX0.HPVn3jcN88M4U3-RCVW-YO-b65rDOKv6pxEaVWwbm68"; // 使用你真正的 eyJ... 金鑰
// 💡 初始化 Supabase 客戶端
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
// --- 2. 取得網址參數 ---
const urlParams = new URLSearchParams(window.location.search);
const currentSymbol = urlParams.get('symbol') || 'PLTR'; // 預設改為 PLTR 以便測試

const metricMeta = {
    revenue: { title: "總營收 (Total Revenue)", desc: "反映公司在特定期間內的銷售規模。", unit: "M USD" },
    gross_profit: { title: "毛利與毛利率 (Gross Profitability)", desc: "毛利反映核心產品競爭力。", unit: "M USD / %" },
    net_income: { title: "淨利與淨利率 (Net Profitability)", desc: "淨利是公司最終盈餘。", unit: "M USD / %" },
    eps_diluted: { title: "每股盈餘 (Diluted EPS)", desc: "股東最關注的每股獲利能力。", unit: "USD" },
    total_equity: { title: "股東權益 (Total Equity)", desc: "代表公司的帳面淨值與財富積累。", unit: "M USD" },
    current_ratio: { title: "流動比率 (Current Ratio)", desc: "短期償債能力指標。", unit: "x" },
    long_term_solvency: { title: "長期償債能力 (Solvency)", desc: "衡量公司長期財務結構的穩定性。", unit: "Ratio" },
    operating_cash_flow: { title: "營運現金流 (OCF)", desc: "反映真實的「造血」功能。", unit: "USD" },
    free_cash_flow: { title: "自由現金流 (FCF)", desc: "可用於擴張或回饋股東的資金。", unit: "USD" },
    capEX_OCF: { title: "資本支出/營運現金比", desc: "反映投入於資本設備與研發的比例。", unit: "Ratio" },
    ocf_netincome: { title: "營運現金/淨利比", desc: "衡量盈餘品質。", unit: "Ratio" },
    roe: { title: "ROE (股東權益報酬率)", desc: "衡量運用股東資金創造利潤的效率。", unit: "%" },
    roa: { title: "ROA (資產報酬率)", desc: "衡量利用總資產創造利潤的效率。", unit: "%" },
    pe: { title: "P/E Ratio (本益比)", desc: "反映預期成長性與溢價。", unit: "x" },
    peg: { title: "PEG Ratio (本益成長比)", desc: "通常 < 1 代表潛在低估。", unit: "Ratio" }
};

const reportStructure = [
    {
        id: "income-statement",
        section: "損益表",
        label: "INCOME STATEMENT",
        desc: "了解公司賺多少、成本多少，以及最後留下多少利潤。",
        color: "#2563eb",
        metrics: ["revenue", "gross_profit", "net_income", "eps_diluted"]
    },
    {
        id: "balance-sheet",
        section: "資產負債表",
        label: "BALANCE SHEET",
        desc: "檢視公司的資產底子、股東權益與短長期償債能力。",
        color: "#7c3aed",
        metrics: ["total_equity", "current_ratio", "long_term_solvency"]
    },
    {
        id: "cash-flow-statement",
        section: "現金流量表",
        label: "CASH FLOW STATEMENT",
        desc: "判斷公司實際產生現金的能力，以及資本支出的負擔。",
        color: "#059669",
        metrics: ["operating_cash_flow", "free_cash_flow", "capEX_OCF", "ocf_netincome"]
    },
    {
        id: "valuation",
        section: "估值與回報",
        label: "VALUATION & RETURNS",
        desc: "補充檢視獲利效率與市場估值，包含 ROE、ROA、P/E 與 PEG。",
        color: "#ea580c",
        metrics: ["roe", "roa", "pe", "peg"],
        isSupplementary: true
    }
];

async function fetchCloudReport() {
    try {
        // 1. 🎯 核心修改：從網址抓取 Token 並「手動登入」
        const urlParams = new URLSearchParams(window.location.search);
        const access = urlParams.get('access_token');
        const refresh = urlParams.get('refresh_token');

        // 如果有傳 Token 過來，就先用它設定 Session
        if (access && refresh) {
            await supabaseClient.auth.setSession({
                access_token: access,
                refresh_token: refresh
            });
        }

        // 2. 接下來才是原本的邏輯
        const { data: { user }, error: authError } = await supabaseClient.auth.getUser();

        if (authError || !user) {
            console.warn("使用者未登入");
            document.body.innerHTML = `<main class="page"><h1>🔒 請先登入</h1><p>「懂才抱」需要確認你的身份以顯示專屬分析報告。</p></main>`;
            return;
        }

        // 3. 抓取資料庫（使用 user.id）
        const { data: result, error: dbError } = await supabaseClient
            .from('tracked_stocks')
            .select('report_json')
            .eq('symbol', currentSymbol.toUpperCase())
            .eq('user_id', user.id) 
            .maybeSingle(); 

        if (dbError) throw dbError;

        if (result && result.report_json) {
            renderDashboard(result.report_json);
        } else {
            document.body.innerHTML = `<main class="page"><h1>❌ 找不到 ${currentSymbol} 的報告</h1><p>請確認是否已新增此股票，或稍等後端 AI 生成資料。</p></main>`;
        }
    } catch (err) {
        console.error("系統讀取錯誤:", err);
    }
}

function renderDashboard(json) {
    // --- 1. 資料安全性防護 ---
    if (!json || !json.data || !json.ai) {
        console.error("載入的 JSON 格式不正確");
        return;
    }

    const data = json.data;
    const ai = json.ai;

    // --- 2. 更新標題與時間 (修正點：增加日期防護避免崩潰) ---
    document.querySelector('.page-title').innerText = `${json.symbol} 財報分析儀表板`;
    
    // 如果 ai_generated_at 缺失，改用 as_of 作為備案
    const rawDate = json.ai_generated_at || json.as_of || "2026-01-01";
    const genDate = rawDate.includes('T') ? rawDate.split('T')[0] : rawDate;
    document.getElementById('update-info').innerText = `數據截止: ${json.as_of} | AI 生成於: ${genDate}`;
    
    document.getElementById('one-liner').innerText = ai.one_liner || "";
    
    // 更新風險標籤
    const riskContainer = document.getElementById('risk-container');
    if (ai.risks) {
        riskContainer.innerHTML = ai.risks.map(r => `<div><span class="risk-tag">RISK</span> <span style="font-size:14px; color:#475569;">${r}</span></div>`).join('');
    }

    // --- 3. 初始化容器 ---
    const container = document.getElementById('dynamic-content');
    container.innerHTML = ''; 

    const getProcessedData = (id) => {
        const raw = data[id];
        if (!raw) return null;
        const ttm = raw.find(i => i.date === "TTM");
        const history = raw.filter(i => i.date !== "TTM").reverse();
        return ttm ? [...history, ttm] : history;
    };

    const getLatestValue = (id) => {
        const series = getProcessedData(id);
        if (!series?.length) return null;
        const value = Number(series[series.length - 1].value);
        return Number.isFinite(value) ? value : null;
    };

    const getChangeRate = (id) => {
        const series = getProcessedData(id)?.filter(item => item.date !== "TTM");
        if (!series || series.length < 2) return null;
        const previous = Number(series[series.length - 2].value);
        const latest = Number(series[series.length - 1].value);
        if (!Number.isFinite(previous) || !Number.isFinite(latest) || previous === 0) return null;
        return ((latest - previous) / Math.abs(previous)) * 100;
    };

    const buildFocusGuide = () => {
        const revenueGrowth = getChangeRate('revenue');
        const netIncome = getLatestValue('net_income');
        const netMargin = getLatestValue('net_margin');
        const freeCashFlow = getLatestValue('free_cash_flow');
        const currentRatio = getLatestValue('current_ratio');
        const solvency = getLatestValue('long_term_solvency');
        const capexRatio = Math.abs(getLatestValue('capEX_OCF') || 0);
        const cashQuality = getLatestValue('ocf_netincome');
        const pe = getLatestValue('pe');
        const peg = getLatestValue('peg');

        let companyType = "穩定經營型";
        if (revenueGrowth !== null && revenueGrowth >= 15 && (netIncome === null || netIncome <= 0 || netMargin < 8)) {
            companyType = "高成長、獲利仍在驗證型";
        } else if (revenueGrowth !== null && revenueGrowth >= 15) {
            companyType = "高成長型";
        } else if (netIncome !== null && netIncome <= 0) {
            companyType = "獲利轉機觀察型";
        } else if (capexRatio >= 0.3) {
            companyType = "資本投入型";
        }

        const candidates = [];
        const addFocus = (metricId, reason, priority) => {
            if (!getProcessedData(metricId) || candidates.some(item => item.metricId === metricId)) return;
            const section = reportStructure.find(sec => sec.metrics.includes(metricId));
            candidates.push({ metricId, reason, priority, sectionId: section?.id });
        };

        if (revenueGrowth !== null && revenueGrowth >= 15) {
            addFocus('revenue', '營收成長較快，應確認成長速度能否延續。', 100);
            addFocus('gross_profit', '高速成長是否健康，要同時觀察毛利與毛利率。', 96);
        }
        if (netIncome !== null && (netIncome <= 0 || (netMargin !== null && netMargin < 8))) {
            addFocus('net_income', '獲利仍偏薄或尚未穩定，淨利與淨利率是關鍵驗證。', 94);
        }
        if (freeCashFlow !== null && freeCashFlow <= 0) {
            addFocus('free_cash_flow', '自由現金流偏弱，需確認成長是否真正轉化為現金。', 98);
        }
        if (cashQuality !== null && (cashQuality < 0.8 || cashQuality > 2.5)) {
            addFocus('ocf_netincome', '營運現金與淨利落差較大，應注意盈餘品質。', 92);
        }
        if (currentRatio !== null && currentRatio < 1.5) {
            addFocus('current_ratio', '短期償債緩衝較有限，流動性值得持續追蹤。', 90);
        }
        if (solvency !== null && solvency > 3) {
            addFocus('long_term_solvency', '債務相對營運現金流較高，需留意長期償債壓力。', 91);
        }
        if (capexRatio >= 0.3) {
            addFocus('capEX_OCF', '資本支出占營運現金流較高，應觀察投入效率。', 88);
        }
        if (pe !== null && pe > 35) {
            addFocus('pe', '本益比較高，市場預期是否過度樂觀值得檢視。', 87);
        }
        if (peg !== null && (peg > 1.5 || peg <= 0)) {
            addFocus('peg', 'PEG 顯示估值與成長的匹配程度需要特別留意。', 89);
        }

        [
            ['revenue', '營收趨勢是判斷公司需求與成長動能的起點。', 60],
            ['gross_profit', '毛利與毛利率可反映產品競爭力及成本控制。', 59],
            ['free_cash_flow', '自由現金流能驗證帳面成長是否帶來可運用現金。', 58],
            ['roe', 'ROE 可觀察公司運用股東資金創造報酬的效率。', 50],
            ['pe', '本益比可協助判斷目前價格反映了多少成長預期。', 49]
        ].forEach(([metricId, reason, priority]) => addFocus(metricId, reason, priority));

        return {
            companyType,
            items: candidates.sort((a, b) => b.priority - a.priority).slice(0, 5)
        };
    };

    const focusGuide = buildFocusGuide();
    const statementGrid = document.createElement('div');
    statementGrid.className = 'statement-grid';
    statementGrid.innerHTML = `
        <button
            type="button"
            class="statement-card focus-entry active"
            data-report-target="key-focus"
            style="--statement-color: #ea580c;"
        >
            <span class="statement-label">DONGCAIBAO FOCUS</span>
            <h2>懂才抱重點</h2>
            <p>依這家公司的財務特徵，從現有指標中挑出最值得優先追蹤的項目。</p>
            <div class="statement-metrics">
                ${focusGuide.items.map(item => `
                    <span class="statement-metric">
                        ${(metricMeta[item.metricId]?.title || item.metricId).split(' (')[0]}
                    </span>
                `).join('')}
            </div>
            <span class="statement-link">目前顯示中</span>
        </button>
    ` + reportStructure
        .filter(sec => !sec.isSupplementary)
        .map(sec => `
            <button
                type="button"
                class="statement-card"
                data-report-target="${sec.id}"
                style="--statement-color: ${sec.color};"
            >
                <span class="statement-label">${sec.label}</span>
                <h2>${sec.section}</h2>
                <p>${sec.desc}</p>
                <div class="statement-metrics">
                    ${sec.metrics.map(metricId => `
                        <span class="statement-metric">
                            ${(metricMeta[metricId]?.title || metricId).split(' (')[0]}
                        </span>
                    `).join('')}
                </div>
                <span class="statement-link">點擊切換查看</span>
            </button>
        `).join('');
    container.appendChild(statementGrid);

    const supplementarySection = reportStructure.find(sec => sec.isSupplementary);
    const supplementaryNav = document.createElement('div');
    supplementaryNav.className = 'supplementary-nav';
    supplementaryNav.innerHTML = `
        <button
            type="button"
            class="supplementary-button"
            data-report-target="${supplementarySection.id}"
        >
            查看估值與回報：ROE、ROA、P/E、PEG
        </button>
    `;
    container.appendChild(supplementaryNav);

    const focusPanel = document.createElement('section');
    focusPanel.className = 'report-panel active';
    focusPanel.id = 'key-focus';
    focusPanel.innerHTML = `
        <h2 class="section-title">懂才抱重點</h2>
        <div class="focus-intro">
            <div class="focus-type">財務特徵：${focusGuide.companyType}</div>
            <p>以下是依目前財務數據挑選的優先觀察項目。這是閱讀順序建議，不是投資評分或買賣建議。</p>
        </div>
        <div class="focus-list">
            ${focusGuide.items.map(item => `
                <button
                    type="button"
                    class="focus-item"
                    data-report-target="${item.sectionId}"
                    data-metric-target="${item.metricId}"
                >
                    <strong>${metricMeta[item.metricId]?.title || item.metricId}</strong>
                    <span>${item.reason}</span>
                    <small>查看指標圖表 →</small>
                </button>
            `).join('')}
        </div>
    `;
    container.appendChild(focusPanel);

    // --- 4. 開始渲染各個區塊 ---
    reportStructure.forEach(sec => {
        const panel = document.createElement('section');
        panel.className = 'report-panel';
        panel.id = sec.id;

        const h2 = document.createElement('h2');
        h2.className = 'section-title';
        h2.innerText = sec.section;
        panel.appendChild(h2);

        const focusItemsInSection = focusGuide.items.filter(item => item.sectionId === sec.id);
        if (focusItemsInSection.length) {
            const quickNav = document.createElement('div');
            quickNav.className = 'focus-quick-nav';
            quickNav.innerHTML = `
                <strong>懂才抱重點</strong>
                ${focusGuide.items.map(item => `
                    <button
                        type="button"
                        class="focus-quick-button"
                        data-report-target="${item.sectionId}"
                        data-metric-target="${item.metricId}"
                    >
                        ${(metricMeta[item.metricId]?.title || item.metricId).split(' (')[0]}
                    </button>
                `).join('')}
                <button type="button" class="focus-back-button">回重點總覽</button>
            `;
            panel.appendChild(quickNav);
        }

        container.appendChild(panel);

        sec.metrics.forEach(metricId => {
            const mData = getProcessedData(metricId);
            
            // --- 修正點：對齊資料鍵值 (Gross Profit vs Gross Margin) ---
            // 在 renderDashboard 迴圈內部找到這一段並替換
            let aiInsight = ai.by_metric[metricId];

            // 🎯 自動對齊邏輯：如果找不到精確 ID，就去對應的大類別找
            if (!aiInsight) {
                // 1. 處理損益表名稱不符
                if (metricId === 'gross_profit') aiInsight = ai.by_metric['gross_margin'];
                if (metricId === 'net_income') aiInsight = ai.by_metric['net_income_and_margin'] || ai.by_metric['net_margin'];

                // 2. 處理 HIMS 把現金流指標合併的情況
                const cashFlowMetrics = ['operating_cash_flow', 'free_cash_flow', 'capEX_OCF', 'ocf_netincome'];
                if (cashFlowMetrics.includes(metricId)) {
                    aiInsight = ai.by_metric['cash_flow']; 
                }

                // 3. 處理 HIMS 把估值指標合併的情況
                const valuationMetrics = ['roe', 'roa', 'pe', 'peg'];
                if (valuationMetrics.includes(metricId)) {
                    aiInsight = ai.by_metric['valuation_metrics'];
                }
                // 🎯 4. 處理「資產負債與償債」類 (預留對應)
                const solvencyGroup = ['total_equity', 'current_ratio', 'long_term_solvency'];
                if (solvencyGroup.includes(metricId)) {
                    // 嘗試抓取可能的大類別名稱
                    aiInsight = ai.by_metric['balance_sheet'] || ai.by_metric['solvency'] || ai.by_metric['financial_condition'];
                }
            }

            // 🎯 只要有數據 (mData) 就一定要畫圖，不能 return 掉
            if (!mData) return; 

            // 🎯 如果經過所有對齊邏輯後還是 null (就像現在 HIMS 的負債表)
            // 我們就補上一個預設的物件，這樣圖表就會出來，只是文字會顯示預設內容
            if (!aiInsight) {
                aiInsight = {
                    summary: "AI 目前針對此指標尚無獨立解讀，請參考圖表數據趨勢。",
                    bullets: [],
                    related_reasons: []
                };
            }

            // 移除原本那行：if (!mData || !aiInsight) return;

            const summaryText = aiInsight.summary || (typeof aiInsight === 'string' ? aiInsight : "");
            const bulletsHtml = aiInsight.bullets 
                ? `<ul style="margin: 12px 0 0; padding-left: 20px; font-size: 14px; color: #475569;">
                    ${aiInsight.bullets.map(b => `<li style="margin-bottom: 4px;">${b}</li>`).join('')}
                   </ul>` 
                : '';

            // --- 處理 Pro 專屬成因分析 ---
            const reasons = aiInsight.related_reasons || [];
            const isLocked = reasons.some(r => typeof r === 'string' && r.includes("升級 Pro 解鎖深度成因分析"));

            const reasonsHtml = `
                <div class="reason-section ${isLocked ? 'locked' : ''}">
                    <div class="reason-title">
                        ${isLocked ? '🔒 深度成因分析 (Pro 專屬)' : '🎯 核心歸因分析'}
                    </div>
                    ${isLocked ? 
                        `<div class="lock-text">
                            結合 AI 即時搜尋，解析數據背後的真實商業成因。<br>
                            <a href="#" class="upgrade-link">立即升級 Pro 查看深度洞察 →</a>
                        </div>` :
                        `<ul class="reason-list">
                            ${reasons.map(r => `<li>${r}</li>`).join('')}
                        </ul>`
                    }
                </div>
            `;

            // --- 生成卡片 HTML ---
            const card = document.createElement('div');
            card.className = 'metric-card';
            card.id = `metric-${metricId}`;
            card.innerHTML = `
                <div class="metric-name">${metricMeta[metricId]?.title || metricId}</div>
                <details>
                    <summary>指標定義與說明</summary>
                    <div class="desc-content">${metricMeta[metricId]?.desc || ""}</div>
                </details>
                <div class="chart-container"><canvas id="chart-${metricId}"></canvas></div>
                <div class="analysis-section">
                    <div class="analysis-summary">
                        <h4>💡 AI 趨勢解讀</h4>
                        <div class="summary-text" style="font-weight: 500;">${summaryText}</div>
                        ${bulletsHtml} 
                        ${reasonsHtml} 
                    </div>
                </div>
            `;
            panel.appendChild(card);

            // --- 初始化 Chart.js ---
            const ctx = document.getElementById(`chart-${metricId}`).getContext('2d');
            const labels = mData.map(i => i.date);
            const values = mData.map(i => i.value);

            if (metricId === 'gross_profit' || metricId === 'net_income') {
                const marginKey = metricId === 'gross_profit' ? 'gross_margin' : 'net_margin';
                const marginData = getProcessedData(marginKey);
                
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [
                            { label: '金額 (M USD)', data: values, backgroundColor: 'rgba(37, 99, 235, 0.6)', yAxisID: 'y', order: 2 },
                            { 
                                label: '百分比 (%)', 
                                data: marginData ? marginData.map(i => i.value) : [], 
                                type: 'line', borderColor: '#10b981', 
                                borderWidth: 3, pointBackgroundColor: (c) => c.chart.data.labels[c.dataIndex] === "TTM" ? "#dc2626" : "#10b981",
                                pointRadius: (c) => c.chart.data.labels[c.dataIndex] === "TTM" ? 8 : 4, tension: 0.4, yAxisID: 'y1', order: 1 
                            }
                        ]
                    },
                    options: getChartOptions('M USD', '%', true)
                });
            } else {
                const isBar = ['eps_diluted'].includes(metricId);
                new Chart(ctx, {
                    type: isBar ? 'bar' : 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: metricMeta[metricId]?.title || metricId,
                            data: values,
                            borderColor: '#2563eb',
                            backgroundColor: isBar ? 'rgba(37, 99, 235, 0.6)' : 'rgba(37, 99, 235, 0.1)',
                            fill: !isBar, tension: 0.4,
                            pointRadius: (c) => c.chart.data.labels[c.dataIndex] === "TTM" ? 8 : 4,
                            pointBackgroundColor: (c) => c.chart.data.labels[c.dataIndex] === "TTM" ? "#dc2626" : "#2563eb",
                        }]
                    },
                    options: getChartOptions(metricMeta[metricId]?.unit || "")
                });
            }
        });

    });

    const reportButtons = [
        ...statementGrid.querySelectorAll('.statement-card'),
        supplementaryNav.querySelector('.supplementary-button')
    ];

    const switchReport = (targetId, metricId = null) => {
        statementGrid.querySelectorAll('.statement-card').forEach(card => {
            const isActive = card.dataset.reportTarget === targetId;
            card.classList.toggle('active', isActive);
            card.querySelector('.statement-link').innerText =
                isActive ? '目前顯示中' : '點擊切換查看';
        });
        supplementaryNav.querySelector('.supplementary-button')
            .classList.toggle('active', targetId === supplementarySection.id);

        container.querySelectorAll('.report-panel').forEach(panel => {
            panel.classList.toggle('active', panel.id === targetId);
        });
        container.querySelectorAll('.focus-quick-button').forEach(button => {
            button.classList.toggle('current', button.dataset.metricTarget === metricId);
        });

        requestAnimationFrame(() => {
            document.querySelectorAll(`#${targetId} canvas`).forEach(canvas => {
                Chart.getChart(canvas)?.resize();
            });
            const scrollTarget = metricId
                ? document.getElementById(`metric-${metricId}`)
                : document.getElementById(targetId);
            scrollTarget?.scrollIntoView({
                behavior: 'smooth',
                block: 'start'
            });
        });
    };

    reportButtons.forEach(button => {
        button.addEventListener('click', () => {
            switchReport(button.dataset.reportTarget);
        });
    });

    focusPanel.querySelectorAll('.focus-item').forEach(button => {
        button.addEventListener('click', () => {
            switchReport(button.dataset.reportTarget, button.dataset.metricTarget);
        });
    });

    container.querySelectorAll('.focus-quick-button').forEach(button => {
        button.addEventListener('click', () => {
            switchReport(button.dataset.reportTarget, button.dataset.metricTarget);
        });
    });

    container.querySelectorAll('.focus-back-button').forEach(button => {
        button.addEventListener('click', () => {
            switchReport('key-focus');
        });
    });
}

function getChartOptions(y1Label, y2Label = '', dual = false) {
    return {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'top' } },
        scales: {
            y: { beginAtZero: false, title: { display: true, text: y1Label } },
            y1: dual ? { position: 'right', title: { display: true, text: y2Label }, min: 0 } : { display: false },
            x: { grid: { display: false } }
        }
    };
}

fetchCloudReport();
</script>
</body>
</html>
