<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>HIMS 財報全自動化分析儀表板</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #2563eb;
      --secondary: #10b981;
      --danger: #dc2626;
      --accent: #6366f1;
      --gray-bg: #f8fafc;
      --card-border: #e2e8f0;
      --text-main: #1e293b;
      --text-muted: #64748b;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background-color: #ffffff;
      color: var(--text-main);
      margin: 0;
      line-height: 1.5;
    }

    main.page {
      max-width: 1000px;
      margin: 0 auto;
      padding: 60px 24px 100px;
    }

    .header { margin-bottom: 40px; }
    .page-title { font-size: 36px; font-weight: 800; letter-spacing: -0.025em; margin: 0; }
    .meta-info { font-size: 14px; color: var(--text-muted); margin-top: 8px; }

    .ai-insight-card {
      background: var(--gray-bg);
      border-left: 4px solid var(--primary);
      padding: 24px;
      border-radius: 8px;
      margin: 32px 0 48px;
    }
    .ai-insight-card h3 { margin: 0 0 12px; font-size: 18px; color: var(--primary); display: flex; align-items: center; }
    .one-liner { font-size: 19px; font-weight: 600; margin-bottom: 16px; }
    .risk-tag { background: #fee2e2; color: var(--danger); padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 700; margin-right: 8px; display: inline-block; vertical-align: middle; }

    .section-title {
      font-size: 24px;
      font-weight: 700;
      margin: 60px 0 24px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--card-border);
    }

    .metric-card {
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 40px;
      background: #fff;
    }

    .metric-name { font-size: 22px; font-weight: 700; margin: 0 0 8px; color: #0f172a; }
    
    details { margin-bottom: 20px; }
    details summary { cursor: pointer; font-size: 14px; font-weight: 600; color: var(--primary); list-style: none; }
    details summary::before { content: "▶ "; font-size: 10px; }
    details[open] summary::before { content: "▼ "; }
    .desc-content { background: #f1f5f9; padding: 16px; border-radius: 8px; margin-top: 10px; font-size: 15px; color: #475569; }

    .chart-container { height: 380px; width: 100%; margin: 24px 0; }

    /* 修正後的 AI 分析顯示區 */
    .analysis-section {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--card-border);
    }
    .analysis-summary h4 {
      font-size: 16px;
      margin: 0 0 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .summary-text { font-size: 15px; color: #334155; line-height: 1.8; }

    /* 新增：成因分析區塊樣式 */
    .reason-section {
      margin-top: 16px;
      padding: 16px;
      border-radius: 12px;
      background: #f0f9ff; /* Pro 版的藍色背景 */
      border: 1px solid #bae6fd;
    }
    
    .reason-section.locked {
      background: #f8fafc; /* 免費版的灰色背景 */
      border: 1px dashed #cbd5e1;
    }

    .reason-title {
      font-size: 14px;
      font-weight: 700;
      color: #0369a1;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
    }

    .locked .reason-title {
      color: #64748b;
    }

    .reason-list {
      margin: 0;
      padding-left: 18px;
      font-size: 14px;
      color: #334155;
    }

    .lock-text {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.6;
    }

    .upgrade-link {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
      display: inline-block;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<main class="page">
  <div class="header">
    <h1 class="page-title">HIMS 財報全自動化分析儀表板</h1>
    <div class="meta-info" id="update-info">載入中...</div>
  </div>

  <div class="ai-insight-card">
    <h3>🤖 AI 智能診斷</h3>
    <div class="one-liner" id="one-liner"></div>
    <div id="risk-container" style="line-height: 2;"></div>
  </div>

  <div id="dynamic-content"></div>
</main>

<script>
// --- 1. Supabase 配置 (請務必使用你剛才設定好 RLS 的那個專案) ---
const SUPABASE_URL = "https://zlkexplsleznuebighte.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpsa2V4cGxzbGV6bnVlYmlnaHRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU0MzAwNjUsImV4cCI6MjA4MTAwNjA2NX0.HPVn3jcN88M4U3-RCVW-YO-b65rDOKv6pxEaVWwbm68"; // 使用你真正的 eyJ... 金鑰
// 💡 初始化 Supabase 客戶端
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
// --- 2. 取得網址參數 ---
const urlParams = new URLSearchParams(window.location.search);
const currentSymbol = urlParams.get('symbol') || 'PLTR'; // 預設改為 PLTR 以便測試

const metricMeta = {
    revenue: { title: "總營收 (Total Revenue)", desc: "反映公司在特定期間內的銷售規模。", unit: "M USD" },
    gross_profit: { title: "毛利與毛利率 (Gross Profitability)", desc: "毛利反映核心產品競爭力。", unit: "M USD / %" },
    net_income: { title: "淨利與淨利率 (Net Profitability)", desc: "淨利是公司最終盈餘。", unit: "M USD / %" },
    eps_diluted: { title: "每股盈餘 (Diluted EPS)", desc: "股東最關注的每股獲利能力。", unit: "USD" },
    total_equity: { title: "股東權益 (Total Equity)", desc: "代表公司的帳面淨值與財富積累。", unit: "M USD" },
    current_ratio: { title: "流動比率 (Current Ratio)", desc: "短期償債能力指標。", unit: "x" },
    long_term_solvency: { title: "長期償債能力 (Solvency)", desc: "衡量公司長期財務結構的穩定性。", unit: "Ratio" },
    operating_cash_flow: { title: "營運現金流 (OCF)", desc: "反映真實的「造血」功能。", unit: "USD" },
    free_cash_flow: { title: "自由現金流 (FCF)", desc: "可用於擴張或回饋股東的資金。", unit: "USD" },
    capEX_OCF: { title: "資本支出/營運現金比", desc: "反映投入於資本設備與研發的比例。", unit: "Ratio" },
    ocf_netincome: { title: "營運現金/淨利比", desc: "衡量盈餘品質。", unit: "Ratio" },
    roe: { title: "ROE (股東權益報酬率)", desc: "衡量運用股東資金創造利潤的效率。", unit: "%" },
    roa: { title: "ROA (資產報酬率)", desc: "衡量利用總資產創造利潤的效率。", unit: "%" },
    pe: { title: "P/E Ratio (本益比)", desc: "反映預期成長性與溢價。", unit: "x" },
    peg: { title: "PEG Ratio (本益成長比)", desc: "通常 < 1 代表潛在低估。", unit: "Ratio" }
};

const reportStructure = [
    { section: "損益表指標", metrics: ["revenue", "gross_profit", "net_income", "eps_diluted"] },
    { section: "資產負債與償債", metrics: ["total_equity", "current_ratio", "long_term_solvency"] },
    { section: "現金流量分析", metrics: ["operating_cash_flow", "free_cash_flow", "capEX_OCF", "ocf_netincome"] },
    { section: "估值與回報", metrics: ["roe", "roa", "pe", "peg"] }
];

async function fetchCloudReport() {
    try {
        // 1. 🎯 核心修改：從網址抓取 Token 並「手動登入」
        const urlParams = new URLSearchParams(window.location.search);
        const access = urlParams.get('access_token');
        const refresh = urlParams.get('refresh_token');

        // 如果有傳 Token 過來，就先用它設定 Session
        if (access && refresh) {
            await supabaseClient.auth.setSession({
                access_token: access,
                refresh_token: refresh
            });
        }

        // 2. 接下來才是原本的邏輯
        const { data: { user }, error: authError } = await supabaseClient.auth.getUser();

        if (authError || !user) {
            console.warn("使用者未登入");
            document.body.innerHTML = `<main class="page"><h1>🔒 請先登入</h1><p>「懂才抱」需要確認你的身份以顯示專屬分析報告。</p></main>`;
            return;
        }

        // 3. 抓取資料庫（使用 user.id）
        const { data: result, error: dbError } = await supabaseClient
            .from('tracked_stocks')
            .select('report_json')
            .eq('symbol', currentSymbol.toUpperCase())
            .eq('user_id', user.id) 
            .maybeSingle(); 

        if (dbError) throw dbError;

        if (result && result.report_json) {
            renderDashboard(result.report_json);
        } else {
            document.body.innerHTML = `<main class="page"><h1>❌ 找不到 ${currentSymbol} 的報告</h1><p>請確認是否已新增此股票，或稍等後端 AI 生成資料。</p></main>`;
        }
    } catch (err) {
        console.error("系統讀取錯誤:", err);
    }
}

function renderDashboard(json) {
    // --- 1. 資料安全性防護 ---
    if (!json || !json.data || !json.ai) {
        console.error("載入的 JSON 格式不正確");
        return;
    }

    const data = json.data;
    const ai = json.ai;

    // --- 2. 更新標題與時間 (修正點：增加日期防護避免崩潰) ---
    document.querySelector('.page-title').innerText = `${json.symbol} 財報分析儀表板`;
    
    // 如果 ai_generated_at 缺失，改用 as_of 作為備案
    const rawDate = json.ai_generated_at || json.as_of || "2026-01-01";
    const genDate = rawDate.includes('T') ? rawDate.split('T')[0] : rawDate;
    document.getElementById('update-info').innerText = `數據截止: ${json.as_of} | AI 生成於: ${genDate}`;
    
    document.getElementById('one-liner').innerText = ai.one_liner || "";
    
    // 更新風險標籤
    const riskContainer = document.getElementById('risk-container');
    if (ai.risks) {
        riskContainer.innerHTML = ai.risks.map(r => `<div><span class="risk-tag">RISK</span> <span style="font-size:14px; color:#475569;">${r}</span></div>`).join('');
    }

    // --- 3. 初始化容器 ---
    const container = document.getElementById('dynamic-content');
    container.innerHTML = ''; 

    const getProcessedData = (id) => {
        const raw = data[id];
        if (!raw) return null;
        const ttm = raw.find(i => i.date === "TTM");
        const history = raw.filter(i => i.date !== "TTM").reverse();
        return ttm ? [...history, ttm] : history;
    };

    // --- 4. 開始渲染各個區塊 ---
    reportStructure.forEach(sec => {
        const h2 = document.createElement('h2');
        h2.className = 'section-title';
        h2.innerText = sec.section;
        container.appendChild(h2);

        sec.metrics.forEach(metricId => {
            const mData = getProcessedData(metricId);
            
            // --- 修正點：對齊資料鍵值 (Gross Profit vs Gross Margin) ---
            // 在 renderDashboard 迴圈內部找到這一段並替換
            let aiInsight = ai.by_metric[metricId];

            // 🎯 自動對齊邏輯：如果找不到精確 ID，就去對應的大類別找
            if (!aiInsight) {
                // 1. 處理損益表名稱不符
                if (metricId === 'gross_profit') aiInsight = ai.by_metric['gross_margin'];
                if (metricId === 'net_income') aiInsight = ai.by_metric['net_income_and_margin'] || ai.by_metric['net_margin'];

                // 2. 處理 HIMS 把現金流指標合併的情況
                const cashFlowMetrics = ['operating_cash_flow', 'free_cash_flow', 'capEX_OCF', 'ocf_netincome'];
                if (cashFlowMetrics.includes(metricId)) {
                    aiInsight = ai.by_metric['cash_flow']; 
                }

                // 3. 處理 HIMS 把估值指標合併的情況
                const valuationMetrics = ['roe', 'roa', 'pe', 'peg'];
                if (valuationMetrics.includes(metricId)) {
                    aiInsight = ai.by_metric['valuation_metrics'];
                }
                // 🎯 4. 處理「資產負債與償債」類 (預留對應)
                const solvencyGroup = ['total_equity', 'current_ratio', 'long_term_solvency'];
                if (solvencyGroup.includes(metricId)) {
                    // 嘗試抓取可能的大類別名稱
                    aiInsight = ai.by_metric['balance_sheet'] || ai.by_metric['solvency'] || ai.by_metric['financial_condition'];
                }
            }

            // 🎯 只要有數據 (mData) 就一定要畫圖，不能 return 掉
            if (!mData) return; 

            // 🎯 如果經過所有對齊邏輯後還是 null (就像現在 HIMS 的負債表)
            // 我們就補上一個預設的物件，這樣圖表就會出來，只是文字會顯示預設內容
            if (!aiInsight) {
                aiInsight = {
                    summary: "AI 目前針對此指標尚無獨立解讀，請參考圖表數據趨勢。",
                    bullets: [],
                    related_reasons: []
                };
            }

            // 移除原本那行：if (!mData || !aiInsight) return;

            const summaryText = aiInsight.summary || (typeof aiInsight === 'string' ? aiInsight : "");
            const bulletsHtml = aiInsight.bullets 
                ? `<ul style="margin: 12px 0 0; padding-left: 20px; font-size: 14px; color: #475569;">
                    ${aiInsight.bullets.map(b => `<li style="margin-bottom: 4px;">${b}</li>`).join('')}
                   </ul>` 
                : '';

            // --- 處理 Pro 專屬成因分析 ---
            const reasons = aiInsight.related_reasons || [];
            const isLocked = reasons.some(r => typeof r === 'string' && r.includes("升級 Pro 解鎖深度成因分析"));

            const reasonsHtml = `
                <div class="reason-section ${isLocked ? 'locked' : ''}">
                    <div class="reason-title">
                        ${isLocked ? '🔒 深度成因分析 (Pro 專屬)' : '🎯 核心歸因分析'}
                    </div>
                    ${isLocked ? 
                        `<div class="lock-text">
                            結合 AI 即時搜尋，解析數據背後的真實商業成因。<br>
                            <a href="#" class="upgrade-link">立即升級 Pro 查看深度洞察 →</a>
                        </div>` :
                        `<ul class="reason-list">
                            ${reasons.map(r => `<li>${r}</li>`).join('')}
                        </ul>`
                    }
                </div>
            `;

            // --- 生成卡片 HTML ---
            const card = document.createElement('div');
            card.className = 'metric-card';
            card.innerHTML = `
                <div class="metric-name">${metricMeta[metricId]?.title || metricId}</div>
                <details>
                    <summary>指標定義與說明</summary>
                    <div class="desc-content">${metricMeta[metricId]?.desc || ""}</div>
                </details>
                <div class="chart-container"><canvas id="chart-${metricId}"></canvas></div>
                <div class="analysis-section">
                    <div class="analysis-summary">
                        <h4>💡 AI 趨勢解讀</h4>
                        <div class="summary-text" style="font-weight: 500;">${summaryText}</div>
                        ${bulletsHtml} 
                        ${reasonsHtml} 
                    </div>
                </div>
            `;
            container.appendChild(card);

            // --- 初始化 Chart.js ---
            const ctx = document.getElementById(`chart-${metricId}`).getContext('2d');
            const labels = mData.map(i => i.date);
            const values = mData.map(i => i.value);

            if (metricId === 'gross_profit' || metricId === 'net_income') {
                const marginKey = metricId === 'gross_profit' ? 'gross_margin' : 'net_margin';
                const marginData = getProcessedData(marginKey);
                
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [
                            { label: '金額 (M USD)', data: values, backgroundColor: 'rgba(37, 99, 235, 0.6)', yAxisID: 'y', order: 2 },
                            { 
                                label: '百分比 (%)', 
                                data: marginData ? marginData.map(i => i.value) : [], 
                                type: 'line', borderColor: '#10b981', 
                                borderWidth: 3, pointBackgroundColor: (c) => c.chart.data.labels[c.dataIndex] === "TTM" ? "#dc2626" : "#10b981",
                                pointRadius: (c) => c.chart.data.labels[c.dataIndex] === "TTM" ? 8 : 4, tension: 0.4, yAxisID: 'y1', order: 1 
                            }
                        ]
                    },
                    options: getChartOptions('M USD', '%', true)
                });
            } else {
                const isBar = ['eps_diluted'].includes(metricId);
                new Chart(ctx, {
                    type: isBar ? 'bar' : 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: metricMeta[metricId]?.title || metricId,
                            data: values,
                            borderColor: '#2563eb',
                            backgroundColor: isBar ? 'rgba(37, 99, 235, 0.6)' : 'rgba(37, 99, 235, 0.1)',
                            fill: !isBar, tension: 0.4,
                            pointRadius: (c) => c.chart.data.labels[c.dataIndex] === "TTM" ? 8 : 4,
                            pointBackgroundColor: (c) => c.chart.data.labels[c.dataIndex] === "TTM" ? "#dc2626" : "#2563eb",
                        }]
                    },
                    options: getChartOptions(metricMeta[metricId]?.unit || "")
                });
            }
        });
    });
}

function getChartOptions(y1Label, y2Label = '', dual = false) {
    return {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'top' } },
        scales: {
            y: { beginAtZero: false, title: { display: true, text: y1Label } },
            y1: dual ? { position: 'right', title: { display: true, text: y2Label }, min: 0 } : { display: false },
            x: { grid: { display: false } }
        }
    };
}

fetchCloudReport();
</script>
</body>
</html>
