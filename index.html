<html lang="zh-Hant">
<head>

  <style>
    :root {
      --primary: #2563eb;
      --secondary: #10b981;
      --danger: #dc2626;
      --accent: #6366f1;
      --gray-bg: #f8fafc;
      --card-border: #e2e8f0;
      --text-main: #1e293b;
      --text-muted: #64748b;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background-color: #ffffff;
      color: var(--text-main);
      margin: 0;
      line-height: 1.5;
    }

    main.page {
      max-width: 1000px;
      margin: 0 auto;
      padding: 60px 24px 100px;
    }

    .header { margin-bottom: 40px; }
    .page-title { font-size: 36px; font-weight: 800; letter-spacing: -0.025em; margin: 0; }
    .meta-info { font-size: 14px; color: var(--text-muted); margin-top: 8px; }

    .ai-insight-card {
      background: var(--gray-bg);
      border-left: 4px solid var(--primary);
      padding: 24px;
      border-radius: 8px;
      margin: 32px 0 48px;
    }
    .ai-insight-card h3 { margin: 0 0 12px; font-size: 18px; color: var(--primary); display: flex; align-items: center; }
    .one-liner { font-size: 19px; font-weight: 600; margin-bottom: 16px; }
    .risk-tag { background: #fee2e2; color: var(--danger); padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 700; margin-right: 8px; display: inline-block; vertical-align: middle; }

    .section-title {
      font-size: 24px;
      font-weight: 700;
      margin: 60px 0 24px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--card-border);
      scroll-margin-top: 24px;
    }

    .statement-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
      margin: 0 0 56px;
    }

    .statement-card {
      display: block;
      width: 100%;
      min-height: 210px;
      padding: 24px;
      color: inherit;
      font: inherit;
      text-align: left;
      text-decoration: none;
      background: #fff;
      border: 1px solid var(--card-border);
      border-top: 5px solid var(--statement-color);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .statement-card:hover,
    .statement-card.active {
      transform: translateY(-4px);
      box-shadow: 0 14px 30px rgba(15, 23, 42, 0.11);
    }

    .statement-card.active {
      background: color-mix(in srgb, var(--statement-color) 6%, white);
      border-color: var(--statement-color);
    }

    .statement-label {
      color: var(--statement-color);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .statement-card h2 {
      margin: 6px 0 8px;
      font-size: 22px;
    }

    .statement-card p {
      min-height: 42px;
      margin: 0 0 16px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .statement-metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .statement-metric {
      padding: 5px 9px;
      color: #334155;
      background: #f1f5f9;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .statement-link {
      display: block;
      margin-top: 18px;
      color: var(--statement-color);
      font-size: 13px;
      font-weight: 700;
    }

    .supplementary-nav {
      display: flex;
      justify-content: flex-end;
      margin: -36px 0 40px;
    }

    .supplementary-button {

      color: #475569;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      background: #f8fafc;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      cursor: pointer;
    }

    .supplementary-button:hover,

    .report-panel {
      display: none;
    }

    }

    @keyframes panel-in {
      from { opacity: 0; transform: translateY(8px); }

    .metric-card {
      border: 1px solid var(--card-border);

<script>

const metricMeta = {

    peg: { title: "PEG Ratio (本益成長比)", desc: "通常 < 1 代表潛在低估。", unit: "Ratio" }
};

const reportStructure = [
    {
        id: "income-statement",
        section: "損益表",
        label: "INCOME STATEMENT",
        desc: "了解公司賺多少、成本多少，以及最後留下多少利潤。",

        color: "#64819e",

async function fetchCloudReport() {
    try {
        // 1. 🎯 核心修改：從網址抓取 Token 並「手動登入」
        const urlParams = new URLSearchParams(window.location.search);
        const access = urlParams.get('access_token');
        const refresh = urlParams.get('refresh_token');

        // 如果有傳 Token 過來，就先用它設定 Session
        if (access && refresh) {
            await supabaseClient.auth.setSession({
                access_token: access,
                refresh_token: refresh
            });
        }

        // 2. 接下來才是原本的邏輯
        const { data: { user }, error: authError } = await supabaseClient.auth.getUser();

        if (authError || !user) {
            console.warn("使用者未登入");
            document.body.innerHTML = `<main class="page"><h1>🔒 請先登入</h1><p>「懂才抱」需要確認你的身份以顯示專屬分析報告。</p></main>`;
            return;
        }

        // 3. 抓取資料庫（使用 user.id）
        const { data: result, error: dbError } = await supabaseClient
            .from('tracked_stocks')
            .select('report_json')
            .eq('symbol', currentSymbol.toUpperCase())
            .eq('user_id', user.id) 
            .maybeSingle(); 

        if (dbError) throw dbError;

        if (result && result.report_json) {
            renderDashboard(result.report_json);
        } else {
            document.body.innerHTML = `<main class="page"><h1>❌ 找不到 ${currentSymbol} 的報告</h1><p>請確認是否已新增此股票，或稍等後端 AI 生成資料。</p></main>`;
        }
    } catch (err) {
        console.error("系統讀取錯誤:", err);
    }
}

function escapeMetricText(value) {
    return String(value ?? '').replace(/[&<>"']/g, char =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
}

function getMetricSnapshot(raw, metricId, periods = {}) {
    const series = (Array.isArray(raw) ? raw : []).filter(item => item && Number.isFinite(item.value));
    const ttm = series.find(item => item.date === 'TTM');
    if (ttm) return { latest: ttm, periodLabel: '近十二個月', comparison: null };
    const history = series.filter(item => /^\d{4}-\d{2}-\d{2}$/.test(item.date)
        && Number.isFinite(Date.parse(item.date)) && new Date(item.date).toISOString().slice(0, 10) === item.date)
        .slice().sort((a, b) => a.date.localeCompare(b.date));
    const latest = history[history.length - 1];
    if (!latest) return null;
    const group = ['revenue', 'gross_profit', 'net_income', 'gross_margin', 'net_margin'].includes(metricId) ? 'income'
        : metricId === 'eps_diluted' ? 'eps'
        : ['total_equity', 'current_ratio', 'long_term_solvency'].includes(metricId) ? 'balance'
        : ['operating_cash_flow', 'free_cash_flow', 'capEX_OCF', 'ocf_netincome'].includes(metricId) ? 'cashFlow' : 'metrics';
    const daysBefore = item => (Date.parse(latest.date) - Date.parse(item.date)) / 86400000;
    const last = history[history.length - 2];
    const spacing = last ? daysBefore(last) : null;
    const period = periods[group] || (spacing >= 60 && spacing <= 120 ? 'quarter'
        : spacing >= 330 && spacing <= 400 ? 'annual' : null);
    const periodLabel = period === 'quarter' ? '最新季度' : period === 'annual' ? '最新年度' : '最新數值';
    // Match a prior-year period before falling back to the immediately preceding quarter.
    let previous = history.slice(0, -1).reverse().find(item => daysBefore(item) >= 330 && daysBefore(item) <= 400);
    let label = period === 'annual' ? '較上年度' : '較去年同期';
    if (!previous && period === 'quarter' && spacing >= 60 && spacing <= 120) {
        previous = last;
        label = '較上一季';
    }
    if (!previous || !period) return { latest, periodLabel, comparison: null };
    const delta = latest.value - previous.value;
    const percentageMetric = metricMeta[metricId]?.unit === '%';
    const monetaryMetric = metricMeta[metricId]?.unit.startsWith('M USD')
        || ['operating_cash_flow', 'free_cash_flow', 'eps_diluted'].includes(metricId);
    const growth = monetaryMetric && previous.value > 0 && latest.value >= 0
        ? delta / previous.value * 100 : null;
    return { latest, periodLabel, comparison: { previous, label, delta, growth,
        kind: percentageMetric ? 'points' : monetaryMetric ? 'amount' : 'ratio' } };
}

function formatMetricValue(metricId, value) {
    const unit = metricMeta[metricId]?.unit;
    const number = n => new Intl.NumberFormat('zh-TW', { maximumFractionDigits: 2 }).format(n);
    if (unit?.startsWith('M USD') || ['operating_cash_flow', 'free_cash_flow'].includes(metricId)) {
        const dollars = value * (unit.startsWith('M USD') ? 1e6 : 1);
        return Math.abs(dollars) >= 1e8 ? `${number(dollars / 1e8)} 億美元`
            : Math.abs(dollars) >= 1e6 ? `${number(dollars / 1e6)} 百萬美元` : `${number(dollars)} 美元`;
    }
    return `${number(value)}${unit === '%' ? '%' : metricId === 'eps_diluted' ? ' 美元' : ' 倍'}`;
}

function renderMetricSnapshot(metricId, snapshot) {
    if (!snapshot) return '';
    const { latest, periodLabel, comparison } = snapshot;
    const cell = (label, value, detail, className = '', direction = '') => `<div class="${className}"${direction ? ` data-direction="${direction}"` : ''}><dt>${escapeMetricText(label)}</dt><dd>${escapeMetricText(value)}${direction ? `<span class="snapshot-direction">${direction === 'increase' ? '↑ 增加' : direction === 'decrease' ? '↓ 減少' : '持平'}</span>` : ''}<small>${escapeMetricText(detail)}</small></dd></div>`;
    let cells = cell(periodLabel, formatMetricValue(metricId, latest.value), latest.date, 'snapshot-current');
    if (comparison) {
        const { label, previous, delta, growth, kind } = comparison;
        const signed = value => `${value > 0 ? '+' : ''}${new Intl.NumberFormat('zh-TW', { maximumFractionDigits: 2 }).format(value)}`;
        const change = growth !== null ? `${signed(growth)}%`
            : kind === 'points' ? `${signed(delta)} 個百分點`
            : `${delta > 0 ? '+' : ''}${formatMetricValue(metricId, delta)}`;
        cells += cell(label + (growth === null && kind === 'amount' ? '差額' : ''), change,
            growth === null && kind === 'amount' ? '零／負值基期或轉虧，不計成長率' : `${previous.date} → ${latest.date}`,
            'snapshot-change', delta > 0 ? 'increase' : delta < 0 ? 'decrease' : 'flat');
        cells += cell('比較基期', formatMetricValue(metricId, previous.value), previous.date);
    }
    return `<dl class="metric-snapshot" aria-label="${escapeMetricText(metricMeta[metricId]?.title || metricId)}數字快照">${cells}</dl>`;
}

function buildMetricReading(metricId, snapshots, data, periods, insight) {
    const meanings = {
        revenue: '營收反映需求規模，但成長能否轉成股東收益，還要一起看毛利率與費用負擔。',

        net_income: '淨利是成本、費用及業外項目共同作用的結果。獲利擴張是否穩健，仍需搭配淨利率與現金回收檢視。',
        eps_diluted: '稀釋 EPS 同時受淨利與稀釋股數影響；僅看每股盈餘變化，無法確認是營運改善、股數改變或兩者共同帶動。',
        total_equity: '股東權益是帳面資本，不等同市值。權益增加仍需搭配報酬率及股數變化，才能評估每股價值的累積。',
        current_ratio: '流動資產是否足以應對短期負債，還取決於應收帳款與存貨能否及時變現，不能只看比率高低。',
        long_term_solvency: '債務相對營運現金流的比值，可作為償債負擔的觀察起點，但不是實際還款年限；負值現金流時尤其不宜直接解讀高低。',
        operating_cash_flow: '營運現金流可檢視獲利是否轉成現金，但也受預收款、應收帳款與存貨變動影響，單期增加未必能持續。',
        free_cash_flow: '自由現金流反映資本支出後可運用的現金；正值不等於一定用來回購，負值也可能與擴張投資有關。',
        capEX_OCF: '這項比率觀察營運現金投入資本支出的程度；投入提高需搭配未來產出檢視，不能直接視為獲利惡化。',
        ocf_netincome: '營運現金與淨利的落差可能來自營運資金或非現金項目；淨利為零或負值時，不適合用一般門檻判斷盈餘品質。',
        roe: 'ROE 同時受獲利與股東權益規模影響；高 ROE 可能涉及回購、槓桿或較小的權益基數，不一定全來自營運優勢。',
        roa: 'ROA 反映資產產生獲利的效率；擴廠、收購及資產減損都可能影響分母，需在相近商業模式下比較。',
        pe: '本益比描述價格相對已實現盈餘的倍數，並不是合理價的判定。估值能否維持，取決於後續獲利是否支撐市場預期。',
        peg: 'PEG 對成長率的定義與基期很敏感，不能單憑低於一倍就判定便宜；需先確認成長假設可否持續。'
    };
    const watches = {
        revenue: '下期同時追蹤同口徑的營收成長與毛利率：需求擴張是否延續，以及增加的收入能否留下利潤。',
        gross_profit: '對照下一期毛利率、產品組合與管理層成本說明，區分規模擴張與單位獲利改善。',
        net_income: '追蹤營收與淨利率是否同向改善，並查看稅率、業外收益或一次性項目是否影響獲利。',
        eps_diluted: '核對同期間淨利與加權平均稀釋股數，判斷 EPS 變化的來源；不要僅憑回購消息推定股數下降。',
        total_equity: '查看保留盈餘、回購與股利如何共同改變權益，並對照 ROE 是否只是分母縮小。',
        current_ratio: '觀察現金、應收帳款及存貨的組成，以及一年內到期負債，確認流動性緩衝的品質。',
        long_term_solvency: '追蹤債務到期安排、利息負擔與年度營運現金流，確認是否需要再融資。',
        operating_cash_flow: '查看現金流量表中的應收帳款、存貨與預收款變化，確認現金增加是否可持續。',
        free_cash_flow: '一起追蹤營運現金流與資本支出，確認現金改善源自本業回收，還是暫時減少投資。',
        capEX_OCF: '觀察資本支出計畫、產能利用率與營收貢獻，確認投資支出是否逐步產生回報。',
        ocf_netincome: '核對同期間非現金費用與營運資金變化，避免把單次收款或低淨利基期視為長期改善。',
        roe: '同時觀察淨利、股東權益及槓桿變化，確認報酬率提高的原因是否可持續。',
        roa: '追蹤新增資產帶來的收入、獲利與資產減損，確認資產投入能否產生相應回報。',
        pe: '下一期確認獲利成長與指引是否延續；盈餘下修時，即使股價不變，本益比也可能上升。',
        peg: '確認成長率計算期間與最新獲利展望，觀察成長放緩是否削弱目前估值的支撐。'
    };
    let meaning = meanings[metricId] || '';
    if (['revenue', 'gross_profit', 'net_income'].includes(metricId)) {
        const marginId = metricId === 'net_income' ? 'net_margin' : 'gross_margin';
        const margin = getMetricSnapshot(data[marginId], marginId, periods);
        const amount = snapshots[metricId];
        if (amount?.comparison && margin?.comparison && amount.latest.date === margin.latest.date
            && amount.comparison.previous.date === margin.comparison.previous.date) {
            const name = marginId === 'net_margin' ? '淨利率' : '毛利率';
            const delta = margin.comparison.delta;
            meaning = delta > 0 ? `${name}提高，表示每單位營收留下的利潤增加。仍需核對產品組合、費用或一次性項目，確認改善能否持續。`
                : delta < 0 ? `${name}下降，表示每單位營收留下的利潤減少；即使金額成長，也不能直接視為獲利效率改善。`
                : `${name}大致持平，金額變化較需從營收規模解讀；下一步應確認成長是否需要更多費用或資本投入。`;
        }
    }
    if (['operating_cash_flow', 'free_cash_flow'].includes(metricId)) {
        const ocf = snapshots.operating_cash_flow?.latest;
        const fcf = snapshots.free_cash_flow?.latest;
        if (ocf && fcf && ocf.date === fcf.date && ocf.value > 0 && fcf.value >= 0 && fcf.value <= ocf.value) {
            const share = (fcf.value / ocf.value * 100).toLocaleString('zh-TW', { maximumFractionDigits: 1 });
            meaning = `同期間約 ${share}% 的營運現金流保留為自由現金流，提供資本支出後的資金彈性；實際用途仍需對照投資、償債與股東回報安排。`;
        }
    }
    const reasons = Array.isArray(insight?.related_reasons) ? [...new Set(insight.related_reasons
        .filter(value => typeof value === 'string' && value.trim()
            && !/^(未披露|未提供|資料不足|無資料|暫無)|升級 Pro 解鎖/.test(value.trim())).map(value => value.trim()))].slice(0, 2) : [];
    const analysis = [insight?.summary, ...(Array.isArray(insight?.bullets) ? insight.bullets.slice(0, 2) : [])];
    const uniqueAnalysis = [...new Set(analysis.filter(value => typeof value === 'string' && value.trim()
        && !/^(未披露|未提供|資料不足|無資料|暫無)|升級 Pro 解鎖|尚無獨立解讀/.test(value.trim()))
        .map(value => value.trim()))];
    if (snapshots[metricId]?.latest && uniqueAnalysis.length) meaning = uniqueAnalysis.join(' ');
    return { meaning, reasons, watch: watches[metricId] || '' };
}

function renderDashboard(json) {
    // --- 1. 資料安全性防護 ---
    if (!json || !json.data || !json.ai) {
        console.error("載入的 JSON 格式不正確");
        return;
    }

    const data = json.data;
    const ai = json.ai;

    // --- 2. 更新標題與時間 (修正點：增加日期防護避免崩潰) ---
    document.querySelector('.page-title').innerText = `${json.symbol} 財報分析儀表板`;
    
    // 如果 ai_generated_at 缺失，改用 as_of 作為備案
    const rawDate = json.ai_generated_at || json.as_of || "2026-01-01";
    const genDate = rawDate.includes('T') ? rawDate.split('T')[0] : rawDate;
    document.getElementById('update-info').innerText = `數據截止: ${json.as_of} | AI 生成於: ${genDate}`;
    
    document.getElementById('one-liner').innerText = ai.one_liner || "";
    
    // 更新風險標籤
    const riskContainer = document.getElementById('risk-container');
    if (ai.risks) {
        riskContainer.innerHTML = ai.risks.map(r => `<div><span class="risk-tag">RISK</span> <span style="font-size:14px; color:#475569;">${r}</span></div>`).join('');
    }

    // --- 3. 初始化容器 ---
    const container = document.getElementById('dynamic-content');
    container.innerHTML = ''; 

    const getProcessedData = (id) => {
        const raw = data[id];
        if (!Array.isArray(raw)) return null;
        const valid = raw.filter(item => item && Number.isFinite(item.value));
        const ttm = valid.find(i => i.date === "TTM");
        const history = valid.filter(i => /^\d{4}-\d{2}-\d{2}$/.test(i.date))
            .slice().sort((a, b) => a.date.localeCompare(b.date));
        if (!history.length && !ttm) return null;
        return ttm ? [...history, ttm] : history;
    };

    const snapshots = Object.fromEntries(Object.keys(metricMeta).map(id =>
        [id, getMetricSnapshot(data[id], id, json.periods)]));

    const summaryCards = [];
    const improvement = ['revenue', 'net_income', 'eps_diluted', 'operating_cash_flow', 'free_cash_flow']
        .map(id => ({ id, snapshot: snapshots[id] }))
        .filter(item => item.snapshot?.comparison?.growth > 0 && item.snapshot.comparison.label !== '較上一季')
        .sort((a, b) => b.snapshot.comparison.growth - a.snapshot.comparison.growth)[0];
    if (improvement) {
        const { id, snapshot } = improvement;
        const name = metricMeta[id].title.split(' (')[0];
        summaryCards.push(['成長亮點', `${name} ${snapshot.comparison.label}成長 ${snapshot.comparison.growth.toLocaleString('zh-TW', { maximumFractionDigits: 1 })}%`,
            `${snapshot.latest.date} 為 ${formatMetricValue(id, snapshot.latest.value)}，比較基期為 ${snapshot.comparison.previous.date}。`]);
    }
    const warning = ['net_income', 'free_cash_flow'].find(id => snapshots[id]?.latest.value < 0);
    if (warning) {
        summaryCards.push(['主要隱憂', `${metricMeta[warning].title.split(' (')[0]}仍為負值`,
            `${snapshots[warning].latest.date} 為 ${formatMetricValue(warning, snapshots[warning].latest.value)}，後續需確認能否改善，不能只看營收擴張。`]);
    } else if (snapshots.current_ratio?.latest.value < 1) {
        summaryCards.push(['主要隱憂', '短期流動性值得留意', `流動比率為 ${formatMetricValue('current_ratio', snapshots.current_ratio.latest.value)}（${snapshots.current_ratio.latest.date}），需進一步查看負債到期與資金安排。`]);
    } else if (Array.isArray(ai.risks) && ai.risks.some(risk => typeof risk === 'string' && risk.trim())) {
        summaryCards.push(['風險觀察', '研究報告中的風險重點', ai.risks.find(risk => typeof risk === 'string' && risk.trim())]);
    }
    if (summaryCards.length) {
        const summary = document.createElement('section');
        summary.className = 'period-summary';
        summary.setAttribute('aria-label', '本期財報重點');
        summary.innerHTML = `<div class="period-summary-heading"><h2>本期財報重點</h2><span>FINANCIAL BRIEF</span></div>
            <div class="period-summary-grid">${summaryCards.map(([label, title, detail]) =>
                `<article class="period-summary-card"><div class="period-summary-label">${escapeMetricText(label)}</div><h3>${escapeMetricText(title)}</h3><p>${escapeMetricText(detail)}</p></article>`).join('')}</div>`;
        container.appendChild(summary);
    }
    const statementGrid = document.createElement('div');
    statementGrid.className = 'statement-grid';
    statementGrid.innerHTML = reportStructure
        .filter(sec => !sec.isSupplementary)
        .map((sec, index) => `
            <button
                type="button"
                class="statement-card${index === 0 ? ' active' : ''}"
                data-report-target="${sec.id}"
                style="--statement-color: ${sec.color};"
            >
                <span class="statement-label">${sec.label}</span>
                <h2>${sec.section}</h2>
                <p>${sec.desc}</p>
                <div class="statement-metrics">
                    ${sec.metrics.map(metricId => `
                        <span class="statement-metric">
                            ${(metricMeta[metricId]?.title || metricId).split(' (')[0]}
                        </span>
                    `).join('')}
                </div>
                <span class="statement-link">${index === 0 ? '目前顯示中' : '點擊切換查看'}</span>
            </button>
        `).join('');
    container.appendChild(statementGrid);

    const supplementarySection = reportStructure.find(sec => sec.isSupplementary);
    const supplementaryNav = document.createElement('div');
    supplementaryNav.className = 'supplementary-nav';
    supplementaryNav.innerHTML = `
        <button
            type="button"
            class="supplementary-button"
            data-report-target="${supplementarySection.id}"
        >
            查看估值與回報：ROE、ROA、P/E、PEG
        </button>
    `;
    container.appendChild(supplementaryNav);

    // --- 4. 開始渲染各個區塊 ---
    reportStructure.forEach(sec => {
        const panel = document.createElement('section');
        panel.className = sec.id === reportStructure.find(item => !item.isSupplementary)?.id ? 'report-panel active' : 'report-panel';
        panel.id = sec.id;

        const h2 = document.createElement('h2');
        h2.className = 'section-title';
        h2.innerText = sec.section;
        panel.appendChild(h2);

        container.appendChild(panel);

        sec.metrics.forEach(metricId => {
            const mData = getProcessedData(metricId);
            
            // --- 修正點：對齊資料鍵值 (Gross Profit vs Gross Margin) ---
            // 在 renderDashboard 迴圈內部找到這一段並替換
            let aiInsight = ai.by_metric[metricId];

            // 🎯 自動對齊邏輯：如果找不到精確 ID，就去對應的大類別找
            if (!aiInsight) {
                // 1. 處理損益表名稱不符
                if (metricId === 'gross_profit') aiInsight = ai.by_metric['gross_margin'];
                if (metricId === 'net_income') aiInsight = ai.by_metric['net_income_and_margin'] || ai.by_metric['net_margin'];

                // 2. 處理 HIMS 把現金流指標合併的情況
                const cashFlowMetrics = ['operating_cash_flow', 'free_cash_flow', 'capEX_OCF', 'ocf_netincome'];
                if (cashFlowMetrics.includes(metricId)) {
                    aiInsight = ai.by_metric['cash_flow']; 
                }

                // 3. 處理 HIMS 把估值指標合併的情況
                const valuationMetrics = ['roe', 'roa', 'pe', 'peg'];
                if (valuationMetrics.includes(metricId)) {
                    aiInsight = ai.by_metric['valuation_metrics'];
                }
                // 🎯 4. 處理「資產負債與償債」類 (預留對應)
                const solvencyGroup = ['total_equity', 'current_ratio', 'long_term_solvency'];
                if (solvencyGroup.includes(metricId)) {
                    // 嘗試抓取可能的大類別名稱
                    aiInsight = ai.by_metric['balance_sheet'] || ai.by_metric['solvency'] || ai.by_metric['financial_condition'];
                }
            }

            // 🎯 只要有數據 (mData) 就一定要畫圖，不能 return 掉
            if (!mData) return; 

            // 🎯 如果經過所有對齊邏輯後還是 null (就像現在 HIMS 的負債表)
            // 我們就補上一個預設的物件，這樣圖表就會出來，只是文字會顯示預設內容
            if (!aiInsight) {
                aiInsight = {
                    summary: "AI 目前針對此指標尚無獨立解讀，請參考圖表數據趨勢。",
                    bullets: [],
                    related_reasons: []
                };
            }

            // 移除原本那行：if (!mData || !aiInsight) return;

            const reading = buildMetricReading(metricId, snapshots, data, json.periods, aiInsight);
            const theme = {
                'income-statement': { color: '#5965bc', soft: '#f0f1fa', fill: 'rgba(89,101,188,.08)' },
                'balance-sheet': { color: '#9278af', soft: '#f4f0f8', fill: 'rgba(146,120,175,.08)' },
                'cash-flow-statement': { color: '#258f84', soft: '#edf7f4', fill: 'rgba(37,143,132,.08)' },
                valuation: { color: '#64819e', soft: '#eef3f8', fill: 'rgba(100,129,158,.08)' }
            }[sec.id];
            const readingBlock = (number, title, content, className = '') => `<div class="metric-reading-block ${className}"><span class="metric-reading-number" aria-hidden="true">${number}</span><div><h4>${title}</h4>${content}</div></div>`;

            // --- 生成卡片 HTML ---
            const card = document.createElement('div');
            card.className = 'metric-card';
            card.id = `metric-${metricId}`;
            card.style.setProperty('--metric-accent', theme.color);
            card.style.setProperty('--metric-soft', theme.soft);
            card.innerHTML = `
                <div class="metric-name">${metricMeta[metricId]?.title || metricId}</div>
                <details>
                    <summary>指標定義與說明</summary>
                    <div class="desc-content">${metricMeta[metricId]?.desc || ""}</div>
                </details>
                ${renderMetricSnapshot(metricId, snapshots[metricId])}
                <div class="chart-container"><canvas id="chart-${metricId}"></canvas></div>
                <div class="metric-reading">
                    ${reading.meaning ? readingBlock('01', '這代表什麼', `<p>${escapeMetricText(reading.meaning)}</p>`) : ''}
                    ${reading.reasons.length ? readingBlock('02', '變動原因', `<ul>${reading.reasons.map(reason => `<li>${escapeMetricText(reason)}</li>`).join('')}</ul>`) : ''}
                    ${reading.watch ? readingBlock('03', '接下來看什麼', `<p>${escapeMetricText(reading.watch)}</p>`, 'reading-watch') : ''}
                </div>
            `;
            panel.appendChild(card);

            // --- 初始化 Chart.js ---
            const ctx = document.getElementById(`chart-${metricId}`).getContext('2d');
            const labels = mData.map(i => i.date);
            const values = mData.map(i => i.value);

            if (metricId === 'gross_profit' || metricId === 'net_income') {
                const marginKey = metricId === 'gross_profit' ? 'gross_margin' : 'net_margin';
                const marginData = getProcessedData(marginKey);
                
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [
                            { label: metricId === 'gross_profit' ? '毛利金額' : '淨利金額', data: values, backgroundColor: 'rgba(89,101,188,.55)', yAxisID: 'y', order: 2 },
                            { 
                                label: metricId === 'gross_profit' ? '毛利率 (%)' : '淨利率 (%)',
                                data: labels.map(date => marginData?.find(point => point.date === date)?.value ?? null),
                                type: 'line', borderColor: '#258f84',
                                borderWidth: 2.5, pointBackgroundColor: '#258f84',
                                pointRadius: (c) => c.chart.data.labels[c.dataIndex] === "TTM" ? 8 : 4, tension: 0.4, yAxisID: 'y1', order: 1 
                            }
                        ]
                    },
                    options: getChartOptions('M USD', '%', true, values, 1e6)
                });
            } else {
                const isBar = ['eps_diluted'].includes(metricId);
                new Chart(ctx, {
                    type: isBar ? 'bar' : 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: metricMeta[metricId]?.title || metricId,
                            data: values,
                            borderColor: theme.color,
                            backgroundColor: isBar ? theme.color : theme.fill,
                            borderWidth: 2.5,
                            fill: !isBar, tension: 0.2,
                            pointRadius: c => c.dataIndex === values.length - 1 ? 5 : 3,
                            pointBackgroundColor: theme.color,
                            pointBorderColor: '#fff', pointBorderWidth: 2,
                        }]
                    },
                    options: getChartOptions(metricMeta[metricId]?.unit || "", '', false,
                        metricMeta[metricId]?.unit === 'M USD' || ['operating_cash_flow', 'free_cash_flow'].includes(metricId) ? values : null,
                        metricMeta[metricId]?.unit === 'M USD' ? 1e6 : 1,
                        { color: theme.color, text: formatMetricValue(metricId, values[values.length - 1]) }),
                    plugins: [latestMetricLabel]
                });
            }
        });

    });

    const reportButtons = [
        ...statementGrid.querySelectorAll('.statement-card'),
        supplementaryNav.querySelector('.supplementary-button')
    ];

    const switchReport = (targetId) => {
        statementGrid.querySelectorAll('.statement-card').forEach(card => {
            const isActive = card.dataset.reportTarget === targetId;
            card.classList.toggle('active', isActive);
            card.querySelector('.statement-link').innerText =
                isActive ? '目前顯示中' : '點擊切換查看';
        });
        supplementaryNav.querySelector('.supplementary-button')
            .classList.toggle('active', targetId === supplementarySection.id);

        container.querySelectorAll('.report-panel').forEach(panel => {
            panel.classList.toggle('active', panel.id === targetId);
        });
        requestAnimationFrame(() => {
            document.querySelectorAll(`#${targetId} canvas`).forEach(canvas => {
                Chart.getChart(canvas)?.resize();
            });
            const scrollTarget = document.getElementById(targetId);
            scrollTarget?.scrollIntoView({
                behavior: 'smooth',
                block: 'start'
            });
        });
    };

    reportButtons.forEach(button => {
        button.addEventListener('click', () => {
            switchReport(button.dataset.reportTarget);
        });
    });

}

const latestMetricLabel = {
    id: 'latestMetricLabel',
    afterDatasetsDraw(chart, args, options) {
        if (!options.text || chart.data.datasets.length !== 1) return;
        const points = chart.getDatasetMeta(0).data;
        const point = points[points.length - 1];
        if (!point || point.skip || !Number.isFinite(point.x) || !Number.isFinite(point.y)) return;
        const { ctx, chartArea } = chart;
        ctx.save();
        ctx.font = '600 11px sans-serif';
        const width = Math.min(ctx.measureText(options.text).width + 16, chartArea.right - chartArea.left);
        const x = Math.max(chartArea.left, Math.min(point.x - width / 2, chartArea.right - width));
        const y = Math.max(chartArea.top + 2, point.y - 32);
        ctx.fillStyle = 'rgba(255,255,255,.95)';
        ctx.fillRect(x, y, width, 24);
        ctx.fillStyle = options.color;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(options.text, x + 8, y + 12, Math.max(1, width - 16));
        ctx.restore();
    }
};

function getChartOptions(y1Label, y2Label = '', dual = false, monetaryValues = null, valueMultiplier = 1, latestLabel = null) {
    const yAxis = { beginAtZero: false, title: { display: true, text: y1Label } };
    const plugins = { legend: { display: dual, position: 'top', labels: { usePointStyle: true, boxWidth: 10, padding: 18 } },
        latestMetricLabel: latestLabel || false };
    if (monetaryValues) {
        // Revenue/profit/equity arrive in millions; cash flows arrive in dollars.
        const magnitude = monetaryValues.reduce((max, value) =>
            Number.isFinite(value) ? Math.max(max, Math.abs(value * valueMultiplier)) : max, 0);
        const divisor = magnitude >= 1e8 ? 1e8 : magnitude >= 1e6 ? 1e6 : 1;
        yAxis.title.text = divisor === 1e8 ? '億美元' : divisor === 1e6 ? '百萬美元' : '美元';
        const formatter = new Intl.NumberFormat('zh-TW', { maximumFractionDigits: 2 });
        yAxis.ticks = { maxTicksLimit: 6, callback: value => formatter.format(value * valueMultiplier / divisor) };
        plugins.tooltip = { callbacks: {
            label: context => context.dataset.yAxisID === 'y1'
                ? `${context.dataset.label}：${formatter.format(context.parsed.y)}%`
                : `${context.dataset.label}：${formatter.format(context.parsed.y * valueMultiplier)} 美元`
        } };
    }
    yAxis.grid = { color: '#edf0f6' };
    if (latestLabel) yAxis.grace = '10%';
    yAxis.border = { display: false };
    yAxis.ticks = { color: '#8190a3', font: { size: 11 }, maxTicksLimit: 6, ...yAxis.ticks };
    return {
        responsive: true, maintainAspectRatio: false,
        layout: { padding: { top: latestLabel ? 20 : 0, right: 8 } },
        plugins,
        scales: {
            y: yAxis,
            y1: dual ? { position: 'right', title: { display: true, text: y2Label }, beginAtZero: true,
                grid: { drawOnChartArea: false }, border: { display: false } } : { display: false },
            x: { grid: { display: false }, border: { display: false }, ticks: { color: '#8190a3', font: { size: 11 }, maxRotation: 0, autoSkip: true, maxTicksLimit: 4 } }
        }
    };
}

fetchCloudReport();
