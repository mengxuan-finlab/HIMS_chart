<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>台股月營收與季報追蹤</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #7c3aed;
      --accent: #0f766e;
      --warning: #ea580c;
      --danger: #dc2626;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
    }

    body {
      margin: 0;
      color: var(--text);
      background: linear-gradient(180deg, #f5f3ff 0%, #ffffff 280px);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }

    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 52px 24px 90px;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(280px, .8fr);
      gap: 24px;
      align-items: stretch;
      margin-bottom: 28px;
    }

    .panel {
      padding: 26px;
      background: rgba(255, 255, 255, .86);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 18px 40px rgba(88, 28, 135, .08);
    }

    .kicker {
      margin: 0 0 8px;
      color: var(--primary);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 46px);
      letter-spacing: -.04em;
      line-height: 1.12;
    }

    .meta {
      margin-top: 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .one-liner {
      margin-top: 20px;
      font-size: 20px;
      font-weight: 800;
    }

    .summary-list {
      margin: 14px 0 0;
      padding-left: 20px;
      color: #334155;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin: 0 0 28px;
    }

    .stat-card {
      padding: 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .stat-value {
      margin-top: 6px;
      font-size: 24px;
      font-weight: 850;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .chart-card {
      padding: 22px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 10px 28px rgba(15, 23, 42, .05);
    }

    .chart-card.wide {
      grid-column: 1 / -1;
    }

    .chart-title {
      margin: 0 0 4px;
      font-size: 20px;
      font-weight: 850;
    }

    .chart-note {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 14px;
    }

    .chart-wrap {
      height: 320px;
    }

    .ai-box {
      margin-top: 18px;
      padding: 16px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      color: #334155;
      font-size: 14px;
    }

    .ai-box strong {
      display: block;
      margin-bottom: 6px;
      color: #0f172a;
    }

    .risk-list {
      margin: 12px 0 0;
      padding-left: 20px;
      color: #7f1d1d;
    }

    .empty {
      padding: 42px;
      text-align: center;
      color: var(--muted);
      background: #fff;
      border: 1px dashed var(--border);
      border-radius: 20px;
    }

    @media (max-width: 820px) {
      main { padding: 34px 16px 72px; }
      .hero, .grid, .stat-grid { grid-template-columns: 1fr; }
      .chart-wrap { height: 280px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <div class="panel">
        <p class="kicker">TAIWAN EQUITY REPORT</p>
        <h1 id="pageTitle">台股月營收與季報追蹤</h1>
        <div class="meta" id="metaInfo">載入中...</div>
        <div class="one-liner" id="oneLiner"></div>
        <ul class="summary-list" id="highlightList"></ul>
      </div>
      <div class="panel">
        <p class="kicker">KEY RISKS</p>
        <h2 style="margin:0;">後續觀察風險</h2>
        <ul class="risk-list" id="riskList"></ul>
      </div>
    </section>

    <section class="stat-grid" id="statGrid"></section>
    <section class="grid" id="chartGrid"></section>
  </main>

  <script>
    const SUPABASE_URL = "https://zlkexplsleznuebighte.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpsa2V4cGxzbGV6bnVlYmlnaHRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU0MzAwNjUsImV4cCI6MjA4MTAwNjA2NX0.HPVn3jcN88M4U3-RCVW-YO-b65rDOKv6pxEaVWwbm68";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    const currentSymbol = (urlParams.get("symbol") || "2330").toUpperCase();

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatValue(value, suffix = "") {
      if (value === null || value === undefined || Number.isNaN(Number(value))) return "資料不足";
      return `${Number(value).toLocaleString("zh-TW", { maximumFractionDigits: 2 })}${suffix}`;
    }

    function latest(series) {
      return Array.isArray(series) && series.length ? series[series.length - 1] : null;
    }

    function metricInsight(ai, metricId) {
      const item = ai?.by_metric?.[metricId];
      if (!item) return "";
      return `
        <div class="ai-box">
          <strong>AI 解讀</strong>
          <div>${escapeHtml(item.summary || "目前資料不足以判斷")}</div>
          <div style="margin-top:8px; color:#64748b;">觀察重點：${escapeHtml(item.watch || "持續追蹤後續資料變化")}</div>
        </div>
      `;
    }

    function renderLineChart(canvas, datasets, yLabel = "") {
      const labels = datasets[0]?.data?.map(item => item.date) || [];
      const chartDatasets = datasets.map(item => ({
        label: item.label,
        data: item.data.map(row => row.value),
        borderColor: item.color,
        backgroundColor: item.fill ? `${item.color}22` : "transparent",
        fill: Boolean(item.fill),
        tension: .35,
        pointRadius: 3
      }));

      new Chart(canvas, {
        type: "line",
        data: { labels, datasets: chartDatasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: "top" } },
          scales: {
            y: { title: { display: Boolean(yLabel), text: yLabel } },
            x: { ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 8 } }
          }
        }
      });
    }

    function addChartCard(grid, report, config) {
      const data = report.data || {};
      const series = config.series
        .map(item => ({ ...item, data: data[item.id] || [] }))
        .filter(item => item.data.length);

      if (!series.length) {
        grid.insertAdjacentHTML("beforeend", `
          <article class="chart-card ${config.wide ? "wide" : ""}">
            <h2 class="chart-title">${escapeHtml(config.title)}</h2>
            <p class="chart-note">${escapeHtml(config.note)}</p>
            <div class="empty">目前資料不足，暫無法繪製此圖表。</div>
            ${metricInsight(report.ai, config.metricId)}
          </article>
        `);
        return;
      }

      const canvasId = `chart-${config.metricId}`;
      grid.insertAdjacentHTML("beforeend", `
        <article class="chart-card ${config.wide ? "wide" : ""}">
          <h2 class="chart-title">${escapeHtml(config.title)}</h2>
          <p class="chart-note">${escapeHtml(config.note)}</p>
          <div class="chart-wrap"><canvas id="${canvasId}"></canvas></div>
          ${metricInsight(report.ai, config.metricId)}
        </article>
      `);
      renderLineChart(document.getElementById(canvasId), series, config.yLabel);
    }

    async function fetchReport() {
      const access = urlParams.get("access_token");
      const refresh = urlParams.get("refresh_token");
      if (access && refresh) {
        await supabaseClient.auth.setSession({ access_token: access, refresh_token: refresh });
      }

      const { data: { user }, error: authError } = await supabaseClient.auth.getUser();
      if (authError || !user) {
        document.body.innerHTML = `<main><div class="empty"><h1>請先登入</h1><p>需要確認身份才能顯示專屬台股報告。</p></div></main>`;
        return;
      }

      const { data, error } = await supabaseClient
        .from("tracked_stocks")
        .select("report_json")
        .eq("symbol", currentSymbol)
        .eq("user_id", user.id)
        .maybeSingle();

      if (error) throw error;
      if (!data?.report_json) {
        document.body.innerHTML = `<main><div class="empty"><h1>找不到 ${escapeHtml(currentSymbol)} 的台股報告</h1><p>請確認台股圖表資料是否已生成完成。</p></div></main>`;
        return;
      }

      renderReport(data.report_json);
    }

    function renderReport(report) {
      const data = report.data || {};
      const ai = report.ai || {};
      const latestRevenue = latest(data.monthly_revenue);
      const latestYoy = latest(data.monthly_revenue_yoy);
      const latestMom = latest(data.monthly_revenue_mom);

      document.getElementById("pageTitle").textContent = `${report.symbol || currentSymbol} 台股月營收與季報追蹤`;
      document.getElementById("metaInfo").textContent = `資料更新：${report.as_of || "未披露"} | 報告類型：台股`;
      document.getElementById("oneLiner").textContent = ai.one_liner || "目前資料不足以形成完整判讀。";
      document.getElementById("highlightList").innerHTML = (ai.highlights || []).map(item => `<li>${escapeHtml(item)}</li>`).join("");
      document.getElementById("riskList").innerHTML = (ai.risks || []).map(item => `<li>${escapeHtml(item)}</li>`).join("") || "<li>目前資料不足以判斷。</li>";

      document.getElementById("statGrid").innerHTML = `
        <div class="stat-card"><div class="stat-label">最新月營收</div><div class="stat-value">${formatValue(latestRevenue?.value, " 億元")}</div></div>
        <div class="stat-card"><div class="stat-label">最新 YoY</div><div class="stat-value">${formatValue(latestYoy?.value, "%")}</div></div>
        <div class="stat-card"><div class="stat-label">最新 MoM</div><div class="stat-value">${formatValue(latestMom?.value, "%")}</div></div>
      `;

      const grid = document.getElementById("chartGrid");
      grid.innerHTML = "";
      [
        {
          title: "月營收趨勢",
          note: "觀察營收規模是否持續放大，以及近期是否出現加速或放緩。",
          metricId: "monthly_revenue",
          yLabel: "新台幣億元",
          wide: true,
          series: [{ id: "monthly_revenue", label: "月營收", color: "#7c3aed", fill: true }]
        },
        {
          title: "營收年增率與月增率",
          note: "YoY 看成長動能，MoM 看短期變化與季節性。",
          metricId: "monthly_revenue_yoy",
          yLabel: "%",
          series: [
            { id: "monthly_revenue_yoy", label: "YoY", color: "#2563eb" },
            { id: "monthly_revenue_mom", label: "MoM", color: "#ea580c" }
          ]
        },
        {
          title: "毛利率與營益率",
          note: "觀察產品組合、報價、成本與營運效率是否支撐獲利品質。",
          metricId: "gross_margin",
          yLabel: "%",
          series: [
            { id: "gross_margin", label: "毛利率", color: "#059669" },
            { id: "operating_margin", label: "營益率", color: "#0f766e" }
          ]
        },
        {
          title: "EPS",
          note: "觀察營收與毛利能否最後轉化成每股盈餘。",
          metricId: "eps",
          yLabel: "元",
          series: [{ id: "eps", label: "EPS", color: "#9333ea" }]
        },
        {
          title: "存貨與應收帳款",
          note: "製造業與電子股常需要搭配存貨、應收帳款觀察景氣轉折與出貨品質。",
          metricId: "inventory",
          yLabel: "仟元",
          series: [
            { id: "inventory", label: "存貨", color: "#dc2626" },
            { id: "accounts_receivable", label: "應收帳款", color: "#f59e0b" }
          ]
        },
        {
          title: "營業現金流",
          note: "檢查帳面獲利是否能轉成實際營運現金。",
          metricId: "operating_cash_flow",
          yLabel: "仟元",
          series: [{ id: "operating_cash_flow", label: "營業現金流", color: "#0284c7" }]
        }
      ].forEach(config => addChartCard(grid, report, config));
    }

    fetchReport().catch(error => {
      console.error(error);
      document.body.innerHTML = `<main><div class="empty"><h1>讀取失敗</h1><p>${escapeHtml(error.message || "系統發生錯誤")}</p></div></main>`;
    });
  </script>
</body>
</html>
