name: 財報 AI 自動化分析

on:
  schedule:
    # 設定每 15 分鐘執行一次 (GitHub 免費版最快頻率)
    - cron: '*/15 * * * *'
  # 允許手動按按鈕觸發 (方便測試用)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安裝必要套件
        run: |
          pip install requests google-genai supabase python-dotenv google-search-results

      - name: 執行分析腳本
        # 這裡會自動把你在 GitHub Secrets 設定的金鑰帶入環境變數
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_MAIN: ${{ secrets.GEMINI_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python script/updated_report.py