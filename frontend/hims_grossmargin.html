<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>HIMS 毛利率變化</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 40px 16px;
    }
    .card {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    h2 {
      text-align: center;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>HIMS 毛利率變化（季度）</h2>
    <canvas id="grossMarginChart"></canvas>
  </div>

  <script>
    // 1. 讀取 JSON
    fetch("hims_grossmargin.json")
      .then(response => response.json())
      .then(data => {
        const labels = data.map(d => d.label);           // 2024Q2...
        const grossMargins = data.map(d => d.gross_margin);

        const ctx = document.getElementById("grossMarginChart").getContext("2d");

        // 2. 建立 Chart.js 圖表
        new Chart(ctx, {
          type: "line",
          data: {
            labels: labels,
            datasets: [{
              label: "毛利率 (%)",
              data: grossMargins,
              borderWidth: 2,
              tension: 0.3,
              pointRadius: 4,
              fill: true
            }]
          },
          options: {
            responsive: true,
            scales: {
              y: {
                ticks: {
                  callback: function(value) {
                    return value + "%";
                  }
                }
              }
            },
            plugins: {
              legend: {
                display: true
              },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    return "毛利率：" + context.parsed.y + " %";
                  }
                }
              }
            }
          }
        });
      })
      .catch(err => {
        console.error("載入 JSON 失敗：", err);
      });
  </script>
</body>
</html>
