<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>HIMS 淨利與淨利率趨勢</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 40px 16px;
    }
    .card {
      max-width: 960px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    h2 {
      margin-bottom: 8px;
      font-size: 20px;
    }
    p.subtitle {
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 13px;
      color: #6b7280;
    }
    canvas {
      max-width: 100%;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>淨利與淨利率趨勢</h2>
    <p class="subtitle">柱狀圖為淨利(百萬 USD)，折線為淨利率(%)。</p>
    <canvas id="netIncomeChart" height="140"></canvas>
  </div>

  <script>
    async function loadData() {
      const netIncomeMargin = await fetch("hims_netmargin.json").then(r => r.json());
      const netIncome = await fetch("hims_netincome.json").then(r => r.json());

      // 合併資料，依 date key 匹配
      const merged = netIncomeMargin
        .map(m => {
          const ni = netIncome.find(x => x.date === m.date) || {};
          return { ...m, ...ni };
        })
        .sort((a, b) => a.date.localeCompare(b.date));

      const labels = merged.map(d => d.date);
      const netIncomeData = merged.map(d => d.netIncome_million);
      const netIncomeMarginData = merged.map(d => d.netIncomeMargin);

      const ctx = document.getElementById("netIncomeChart").getContext("2d");

      new Chart(ctx, {
        data: {
          labels: labels,
          datasets: [
            {
              type: "bar",
              label: "淨利 (百萬 USD)",
              data: netIncomeData,
              yAxisID: "y",
              borderWidth: 1
            },
            {
              type: "line",
              label: "淨利率 (%)",
              data: netIncomeMarginData,
              yAxisID: "y1",
              borderWidth: 2,
              pointRadius: 3,
              tension: 0.3
            }
          ]
        },
        options: {
          responsive: true,
          interaction: { mode: "index", intersect: false },
          plugins: {
            legend: { position: "top" },
            tooltip: {
              callbacks: {
                label: (ctx) => {
                  const label = ctx.dataset.label;
                  const v = ctx.parsed.y;
                  return ctx.dataset.yAxisID === "y1"
                    ? `${label}: ${v.toFixed(2)}%`
                    : `${label}: ${v.toFixed(3)}M`;
                }
              }
            }
          },
          scales: {
            y: {
              type: "linear",
              position: "left",
              beginAtZero: true,
              title: { display: true, text: "淨利 (百萬 USD)" }
            },
            y1: {
              type: "linear",
              position: "right",
              beginAtZero: true,
              min: 0,
              max: 30,
              grid: { drawOnChartArea: false },
              ticks: { callback: v => v + "%" },
              title: { display: true, text: "淨利率 (%)" }
            }
          }
        }
      });
    }

    loadData();
  </script>
</body>
</html>
