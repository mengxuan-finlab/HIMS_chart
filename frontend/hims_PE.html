<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>HIMS 歷年本益比 (含 TTM)</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 40px 16px;
    }
    .card {
      max-width: 1000px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      padding: 36px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    h2 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 24px;
      color: #111827;
    }
    canvas {
      width: 100%;
      height: 500px !important; /* 🔺固定高度 */
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>HIMS 歷年本益比 (含 TTM)</h2>
    <canvas id="peChart"></canvas>
  </div>

  <script>
  fetch("hims_PE.json")
    .then(r => r.json())
    .then(data => {
      // 1) 拆開 TTM 與歷史
    const ttm = data.find(d => d.date === "TTM");
    const hist = data
      .filter(d => d.date !== "TTM")
      .sort((a, b) => new Date(a.date) - new Date(b.date)); // 依日期由舊到新

    // 2) 合併：歷史 + (TTM放最後)
    const ordered = ttm ? [...hist, ttm] : hist;

    const labels = ordered.map(d => d.date);
    const values = ordered.map(d => d.priceToEarningsRatio);

      new Chart(document.getElementById("peChart"), {
        type: "line",
        data: {
          labels,
          datasets: [{
            label: "本益比 (P/E)",
            data: values,
            borderColor: "#2563EB",
            borderWidth: 3,
            tension: 0.35,
            pointBackgroundColor: ctx => ctx.chart.data.labels[ctx.dataIndex] === "TTM" ? "#DC2626" : "#2563EB",
            pointBorderColor: ctx => ctx.chart.data.labels[ctx.dataIndex] === "TTM" ? "#DC2626" : "#2563EB",
            pointRadius: ctx => ctx.chart.data.labels[ctx.dataIndex] === "TTM" ? 10 : 5,
            pointHoverRadius: ctx => ctx.chart.data.labels[ctx.dataIndex] === "TTM" ? 12 : 7,
            pointStyle: ctx => ctx.chart.data.labels[ctx.dataIndex] === "TTM" ? "circle" : "circle",
            fill: false
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: "bottom",
              labels: { font: { size: 16 } }
            },
            tooltip: {
              titleFont: { size: 16 },
              bodyFont: { size: 15 },
              callbacks: {
                label: (ctx) => `P/E：${ctx.parsed.y.toFixed(2)}`
              }
            }
          },
          scales: {
            y: {
              title: { display: true, text: "P/E Ratio", font: { size: 18 } },
              ticks: { font: { size: 14 } }
            },
            x: {
              title: { display: true, text: "年度 / TTM", font: { size: 18 } },
              ticks: { font: { size: 13 } }
            }
          }
        }
      });
    });
  </script>
</body>
</html>
