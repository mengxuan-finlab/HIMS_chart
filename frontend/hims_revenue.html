<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>HIMS 營收圖表 (季度)</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 40px 16px;
    }
    .card {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    h2 {
      text-align: center;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>HIMS 營收圖表 (季度)</h2>
    <canvas id="revenueChart"></canvas>
  </div>

  <script>
  // 1. 讀取 JSON
  fetch("hims_revenue.json")
    .then(response => response.json())
    .then(data => {
      data.reverse(); //  讓 2020 → 2024 順序從左到右遞增  
      // 對應正確欄位
      const labels = data.map(d => d.date);        // X軸：日期
      const revenue_million = data.map(d => d.revenue_million);    // Y軸：股東權益數值

      const ctx = document.getElementById("revenueChart").getContext("2d");

      // 2. 建立 Chart.js 圖表
      new Chart(ctx, {
        type: "line",
        data: {
          labels: labels,
          datasets: [{
            label: "營收(美元)",
            data: revenue_million,
            borderColor: "#36A2EB",
            backgroundColor: "rgba(54,162,235,0.2)",
            borderWidth: 2,
            tension: 0.3,
            pointRadius: 4,
            fill: true
          }]
        },
        options: {
          responsive: true,
          scales: {
            y: {
              ticks: {
                callback: function(value) {
                  // 直接顯示小數兩位，例如 0.05, 0.20, -0.10
                  return value.toFixed(2);
                }
              },
              title: {
                display: true,
                text: "營收（美元 / 股）"
              }
            },
            x: {
              title: {
                display: true,
                text: "季度"
              }
            }
          },
          plugins: {
            legend: { display: true },
            tooltip: {
              callbacks: {
                label: function(context) {
                  return "revenue：" + context.parsed.y.toFixed(2) + " (百萬)美元/股";
                }
              }
            }
          }
        }
      });
    })
    .catch(err => console.error("載入 JSON 失敗：", err));
  </script>
</body>
</html>
