<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>HIMS 毛利與毛利率趨勢</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 40px 16px;
    }
    .card {
      max-width: 960px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }
    p.subtitle {
      margin: 0 0 16px;
      font-size: 13px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>毛利與毛利率趨勢</h2>
    <p class="subtitle">柱狀圖為毛利(百萬 USD)，折線為毛利率(%)。</p>
    <canvas id="grossChart" height="140"></canvas>
  </div>

  <script>
    async function loadData() {
      const grossMargin = await fetch("hims_grossmargin.json").then(r => r.json());
      const grossProfit = await fetch("hims_grossprofit.json").then(r => r.json());

      // 合併資料（以日期為 key）
      const merged = grossMargin
        .map(gm => {
          const gp = grossProfit.find(x => x.date === gm.date) || {};
          return { ...gm, ...gp };
        })
        .sort((a, b) => a.date.localeCompare(b.date));

      const labels = merged.map(d => d.date);
      const grossProfitData = merged.map(d => d.grossProfit_million);
      const grossMarginData = merged.map(d => d.grossMargin);

      const ctx = document.getElementById("grossChart").getContext("2d");

      new Chart(ctx, {
        data: {
          labels: labels,
          datasets: [
            {
              type: "bar",
              label: "毛利 (百萬 USD)",
              data: grossProfitData,
              yAxisID: "y",
              borderWidth: 1
            },
            {
              type: "line",
              label: "毛利率 (%)",
              data: grossMarginData,
              yAxisID: "y1",
              tension: 0.3,
              borderWidth: 2,
              pointRadius: 3
            }
          ]
        },
        options: {
          responsive: true,
          interaction: { mode: "index", intersect: false },
          plugins: {
            legend: { position: "top" },
            tooltip: {
              callbacks: {
                label: (ctx) => {
                  const label = ctx.dataset.label;
                  const v = ctx.parsed.y;
                  return ctx.dataset.yAxisID === "y1"
                    ? `${label}: ${v.toFixed(2)}%`
                    : `${label}: ${v.toFixed(3)}M`;
                }
              }
            }
          },
          scales: {
            y: {
              type: "linear",
              position: "left",
              beginAtZero: true,
              title: { display: true, text: "毛利 (百萬 USD)" }
            },
            y1: {
              type: "linear",
              position: "right",
              beginAtZero: true,
              min: 0,
              max: 100,
              grid: { drawOnChartArea: false },
              ticks: { callback: (v) => v + "%"},
              title: { display: true, text: "毛利率 (%)" }
            }
          }
        }
      });
    }

    loadData();
  </script>
</body>
</html>
