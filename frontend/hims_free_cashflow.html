<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>HIMS 自由現金流變化 (年度)</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 40px 16px;
    }
    .card {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    h2 {
      text-align: center;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>HIMS 自由現金流變化 (年度)</h2>
    <canvas id="free_cash_flowChart"></canvas>
  </div>

  <script>
  // 1. 讀取 JSON
  fetch("hims_free_cashflow.json")
    .then(response => response.json())
    .then(data => {
      data.reverse(); //  讓 2020 → 2024 順序從左到右遞增  
      // 對應正確欄位
      const labels = data.map(d => d.date);        // X軸：日期
      const freecashflow = data.map(d => d.free_cash_flow);    // Y軸：股東權益數值

      const ctx = document.getElementById("free_cash_flowChart").getContext("2d");

      // 2. 建立 Chart.js 圖表
      new Chart(ctx, {
        type: "line",
        data: {
          labels: labels,
          datasets: [{
            label: "自由現金流（美元）",
            data: freecashflow,
            borderColor: "#36A2EB",
            backgroundColor: "rgba(54,162,235,0.2)",
            borderWidth: 2,
            tension: 0.3,
            pointRadius: 4,
            fill: true
          }]
        },
        options: {
          responsive: true,
          scales: {
            y: {
              ticks: {
                callback: function(value) {
                  // 格式化數字（例如轉成百萬顯示）
                  return (value / 1_000_000).toFixed(1) + "M";
                }
              },
              title: {
                display: true,
                text: "金額（百萬美元）"
              }
            },
            x: {
              title: {
                display: true,
                text: "年度"
              }
            }
          },
          plugins: {
            legend: { display: true },
            tooltip: {
              callbacks: {
                label: function(context) {
                  return "自由現金流：" + context.parsed.y.toLocaleString() + " 美元";
                }
              }
            }
          }
        }
      });
    })
    .catch(err => {
      console.error("載入 JSON 失敗：", err);
    });
</script>
</body>
</html>
